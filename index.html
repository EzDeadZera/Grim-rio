<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimório — mesa de RPG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1730'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23d8b060' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M12 2 21 7v10l-9 5-9-5V7z' stroke-width='2.2'/%3E%3Cpath d='M12 2 7.5 9.5h9zM3 7l4.5 2.5L3 17M21 7l-4.5 2.5L21 17M7.5 9.5 12 17l4.5-7.5M12 17v5M3 17h18' stroke-width='1.35'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Rye&family=Oswald:wght@500;600&family=Metal+Mania&family=MedievalSharp&family=Press+Start+2P&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1eff7; --bg2:#e7e3f1; --surface:#ffffff; --surface2:#f6f4fb; --line:#d6d1e6;
  --text:#231f3a; --muted:#5f5982; --brass:#8f6a1c; --brass-soft:#f3e6c6; --on-brass:#ffffff;
  --hp:#bf3f36; --mana:#2f63c9; --ok:#2f8a57; --danger:#b3362e;
  --plank:#b58a55; --plank-edge:#8a6436; --shadow:0 14px 40px rgba(35,31,58,.16);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b30; --bg2:#252340; --surface:#2c2948; --surface2:#343057; --line:#46406d;
    --text:#efe8d8; --muted:#aca6c9; --brass:#d8b060; --brass-soft:#3d3553; --on-brass:#221c0e;
    --hp:#dd5c52; --mana:#6a98f2; --ok:#63bc8b; --danger:#e0645b;
    --plank:#5a4128; --plank-edge:#3b2a19; --shadow:0 16px 44px rgba(6,4,18,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b30; --bg2:#252340; --surface:#2c2948; --surface2:#343057; --line:#46406d;
  --text:#efe8d8; --muted:#aca6c9; --brass:#d8b060; --brass-soft:#3d3553; --on-brass:#221c0e;
  --hp:#dd5c52; --mana:#6a98f2; --ok:#63bc8b; --danger:#e0645b;
  --plank:#5a4128; --plank-edge:#3b2a19; --shadow:0 16px 44px rgba(6,4,18,.55);
  color-scheme:dark;
}
/* ===== TEMAS (data-skin) — vêm depois do claro/escuro, então prevalecem ===== */
:root[data-skin="cores"]{
  --bg:#101a17; --bg2:#16241f; --surface:#1a2b25; --surface2:#21362e; --line:#2e4c40;
  --text:#e7f0e9; --muted:#9bb5a8; --brass:#d9a441; --brass-soft:#2a4238; --on-brass:#12201a;
  --hp:#e0655b; --mana:#4fb0c6; --ok:#69c58f; --danger:#e88079;
  --plank:#4a3a25; --plank-edge:#31251a; --shadow:0 16px 44px rgba(2,12,8,.55); color-scheme:dark;
}
:root[data-skin="oeste"]{
  --bg:#e8dcc0; --bg2:#dccdaa; --surface:#f4ecd8; --surface2:#e6d9bb; --line:#b9a179;
  --text:#2a1f14; --muted:#6b573c; --brass:#8a3b1e; --brass-soft:#ecd9b4; --on-brass:#f7f0dd;
  --hp:#9b2d1f; --mana:#3d5a80; --ok:#4b6b35; --danger:#8f2418;
  --plank:#a87a48; --plank-edge:#6d4a27; --shadow:0 14px 40px rgba(60,40,15,.3);
  --serif:'Rye', Georgia, serif; color-scheme:light;
}
:root[data-skin="oeste"] .display,:root[data-skin="oeste"] h2{letter-spacing:.01em}
:root[data-skin="oeste"] .btn,:root[data-skin="oeste"] .icon-btn,:root[data-skin="oeste"] .inp{border-width:2px}
:root[data-skin="ordem"]{
  --bg:#0d0a14; --bg2:#141020; --surface:#1a1526; --surface2:#231c33; --line:#342a4a;
  --text:#ece9f5; --muted:#a49bc0; --brass:#8b5cf6; --brass-soft:#2a1f45; --on-brass:#0d0a14;
  --hp:#e03e3e; --mana:#a855f7; --ok:#3ecf8e; --danger:#ff5d5d;
  --plank:#2a2140; --plank-edge:#180f2c; --shadow:0 18px 50px rgba(0,0,0,.7);
  --serif:'Oswald', Impact, sans-serif; color-scheme:dark;
}
:root[data-skin="ordem"] h1,:root[data-skin="ordem"] h2,:root[data-skin="ordem"] h3{letter-spacing:.03em;text-transform:uppercase}
:root[data-skin="ordem"] .lede,:root[data-skin="ordem"] .cc-sub{text-transform:none}
:root[data-skin="hexatombe"]{
  --bg:#12060a; --bg2:#1b090d; --surface:#250a10; --surface2:#340e15; --line:#5c1a22;
  --text:#f3dede; --muted:#c08b8b; --brass:#a51219; --brass-soft:#3a0d12; --on-brass:#ffeaea;
  --hp:#e5484d; --mana:#e08b2e; --ok:#7fb069; --danger:#ff6b6b;
  --plank:#3a0d12; --plank-edge:#210408; --shadow:0 18px 50px rgba(0,0,0,.75);
  --serif:'Metal Mania', Impact, serif; color-scheme:dark;
}
:root[data-skin="hexatombe"] .display,:root[data-skin="hexatombe"] .gs-name{text-shadow:0 2px 14px rgba(229,72,77,.4)}
:root[data-skin="fantasy"]{
  --bg:#141210; --bg2:#1c1916; --surface:#221e1a; --surface2:#2b2621; --line:#4a3f33;
  --text:#e6d9bf; --muted:#a8967a; --brass:#c9a227; --brass-soft:#332b20; --on-brass:#1a1610;
  --hp:#b03a34; --mana:#4573a8; --ok:#7d9c52; --danger:#d15c53;
  --plank:#3a2c1d; --plank-edge:#241a10; --shadow:0 18px 46px rgba(0,0,0,.65);
  --serif:'MedievalSharp', Georgia, serif; color-scheme:dark;
}
:root[data-skin="fantasy"] .btn,:root[data-skin="fantasy"] .modal,:root[data-skin="fantasy"] .camp-card,
:root[data-skin="fantasy"] .char-card,:root[data-skin="fantasy"] .mon-card,:root[data-skin="fantasy"] .field-card{
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brass) 22%,transparent)}
:root[data-skin="minecraft"]{
  --bg:#191410; --bg2:#221a14; --surface:#2a211a; --surface2:#33291f; --line:#54412c;
  --text:#e9d7b0; --muted:#b09a74; --brass:#c8a24a; --brass-soft:#3a2e1e; --on-brass:#1a1410;
  --hp:#b23a3a; --mana:#4a7fb2; --ok:#6aa84f; --danger:#d16060;
  --plank:#6b4a2a; --plank-edge:#412c18; --shadow:0 12px 0 rgba(0,0,0,.45);
  --serif:'Press Start 2P', 'Courier New', monospace; color-scheme:dark;
}
:root[data-skin="minecraft"] *{border-radius:0!important}
:root[data-skin="minecraft"] .display{font-size:clamp(18px,2.6vw,28px);line-height:1.5;letter-spacing:0}
:root[data-skin="minecraft"] .gs-name{font-size:clamp(17px,2.4vw,26px);line-height:1.5}
:root[data-skin="minecraft"] h2{font-size:16px;line-height:1.5}
:root[data-skin="minecraft"] h3{font-size:13px;line-height:1.6}
:root[data-skin="minecraft"] .attr .av{font-size:19px}
:root[data-skin="minecraft"] .gs-attrs .av{font-size:22px}
:root[data-skin="minecraft"] .initial{font-size:34px}
:root[data-skin="minecraft"] .spine-title{font-size:12px;letter-spacing:0}
:root[data-skin="minecraft"] .brand{font-size:14px}
:root[data-skin="minecraft"] .field-card.solo h3{font-size:clamp(15px,2.2vw,24px)}
:root[data-skin="minecraft"] .btn,:root[data-skin="minecraft"] .icon-btn,:root[data-skin="minecraft"] .field-toggle,
:root[data-skin="minecraft"] .inp,:root[data-skin="minecraft"] .chip{border-width:2px}
:root[data-skin="minecraft"] .cover-fallback{font-size:34px}

:root[data-skin="aventura"]{
  --bg:#2e2016; --bg2:#3b2a1c; --surface:#4a3524; --surface2:#5a4129; --line:#80603c;
  --text:#f8ecd4; --muted:#c3a87e; --brass:#d1482f; --brass-soft:#5e2a1c; --on-brass:#fff4e0;
  --hp:#d1482f; --mana:#2fa3a0; --ok:#8fbf3f; --danger:#e0604a;
  --plank:#8a5a30; --plank-edge:#56351a; --shadow:0 14px 36px rgba(12,6,2,.6);
  --serif:'Luckiest Guy', 'Fraunces', Georgia, serif; color-scheme:dark;
}
:root[data-skin="aventura"] .display{font-size:clamp(25px,3.9vw,39px);letter-spacing:.01em}
:root[data-skin="aventura"] .gs-name{font-size:clamp(25px,3.7vw,39px)}
:root[data-skin="aventura"] h2{font-size:20px}
:root[data-skin="aventura"] .spine-title{letter-spacing:0}
/* tábuas de madeira ao fundo */
:root[data-skin="aventura"] .bg-layer{background-image:
  repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 3px,transparent 3px 430px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 4px,rgba(255,225,170,.05) 4px 6px,transparent 6px 94px),
  repeating-linear-gradient(0deg,rgba(255,220,160,.03) 0 1px,transparent 1px 9px),
  radial-gradient(ellipse 70% 50% at 50% -6%,rgba(255,205,135,.12),transparent 62%);
  box-shadow:inset 0 0 200px rgba(0,0,0,.6)}
:root[data-skin="aventura"] .theme-art{opacity:.26;color:#7a4e27;height:min(26vh,240px)}
:root[data-skin="aventura"] .theme-mark{opacity:.15;color:#b03a26;right:2vw;top:12vh;width:min(30vw,340px)}
/* molduras com borda creme, como as peças do kit */
:root[data-skin="aventura"] .frame{border-radius:14px}
:root[data-skin="aventura"] .frame::after{
  box-shadow:inset 0 0 0 3px #f0e0bd,inset 0 0 0 6px #4a3524,inset 0 0 0 8px rgba(0,0,0,.45)}
/* botões com relevo de madeira */
:root[data-skin="aventura"] .btn,:root[data-skin="aventura"] .icon-btn,
:root[data-skin="aventura"] .chip,:root[data-skin="aventura"] .field-toggle{
  border-width:2px;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.38)}
:root[data-skin="aventura"] .btn:active,:root[data-skin="aventura"] .icon-btn:active,
:root[data-skin="aventura"] .chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.38)}
:root[data-skin="aventura"] .inp{border-width:2px;border-radius:10px}
:root[data-skin="aventura"] .topbar{border-bottom:3px solid var(--plank-edge)}
:root[data-skin="aventura"] .modal header{background:var(--surface2);border-bottom-width:3px}
/* títulos de seção viram fitas */
:root[data-skin="aventura"] .block h2{display:inline-flex;align-self:flex-start;background:var(--brass);
  color:var(--on-brass);padding:7px 22px;letter-spacing:.02em;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
:root[data-skin="aventura"] .block h2::after{display:none}
/* anotações em pergaminho */
:root[data-skin="aventura"] .notes{background:#f3e5c6;color:#402e1c;border:2px solid #c0a473;
  box-shadow:inset 0 0 36px rgba(150,110,55,.22)}
:root[data-skin="aventura"] .empty{border-width:2px}

/* ===== abertura ao entrar ===== */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center}
.splash.out{animation:splashOut .55s ease forwards}
.splash-inner{position:relative;display:grid;place-items:center;gap:26px}
.splash-ring{position:absolute;top:-34px;width:190px;height:190px;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--brass) 22%,transparent);
  border-top-color:var(--brass);border-right-color:color-mix(in srgb,var(--brass) 60%,transparent);
  animation:spin 1.5s linear infinite}
.splash-ring.inner{width:142px;height:142px;top:-10px;border-color:color-mix(in srgb,var(--text) 10%,transparent);
  border-bottom-color:var(--brass);animation:spin 2.2s linear infinite reverse}
.splash-mark{width:104px;color:var(--brass);animation:markIn .9s cubic-bezier(.2,.8,.2,1) both}
.splash-mark svg{width:100%;height:auto;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--brass) 45%,transparent))}
.splash-mark.master{animation:markIn .9s cubic-bezier(.2,.8,.2,1) both, markPulse 1.8s ease-in-out .9s infinite}
.splash-txt{font-family:var(--serif);font-size:19px;margin:0;animation:fadeUp .7s ease .35s both}
.splash-sub{margin:6px 0 0;font-size:14px;color:var(--muted);animation:fadeUp .7s ease .55s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinC{to{transform:translate(-50%,-50%) rotate(394deg)}}
@keyframes markIn{0%{opacity:0;transform:scale(.55) rotate(-24deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes markPulse{50%{opacity:.6;transform:scale(1.05)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* ===== morte e derrota ===== */
.fx{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 50%,rgba(6,4,10,.7),rgba(4,3,8,.94));animation:fxIn .45s ease both}
.fx.out{animation:fxOut .7s ease forwards}
.fx-card{position:relative;display:grid;justify-items:center;gap:12px;max-width:min(440px,86vw)}
.fx-img{position:relative;width:min(260px,62vw);aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#15121c}
.fx-img img{width:100%;height:100%;object-fit:cover}
.fx-name{font-family:var(--serif);font-size:clamp(24px,4vw,34px);margin:0;color:#f1ebdd;text-align:center}
.fx-sub{margin:0;color:#b9b0c4;font-size:15px}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes fxOut{to{opacity:0;visibility:hidden}}
.fx-death .fx-img{animation:fall 2.6s cubic-bezier(.3,0,.2,1) both}
.fx-death .fx-img img{filter:grayscale(1) brightness(.72) contrast(1.08)}
.fx-death .fx-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(120,18,18,.5))}
.fx-death .fx-name{animation:fadeUp .9s ease .5s both;letter-spacing:.06em}
.fx-death .fx-sub{animation:fadeUp .9s ease .75s both}
@keyframes fall{0%{opacity:0;transform:scale(1.06) translateY(-14px)}25%{opacity:1;transform:none}
  100%{opacity:.75;transform:translateY(26px) rotate(-2deg)}}
.fx-boss .fx-img{position:relative;animation:bossShake .5s ease .25s 2 both}
.fx-boss .fx-img img{filter:grayscale(.7) brightness(.82)}
/* raios do chefe derrotado */
.fx-rays{position:absolute;top:44%;left:50%;width:min(620px,130vw);aspect-ratio:1;border-radius:50%;z-index:-1;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle,color-mix(in srgb,var(--brass) 45%,transparent) 0,transparent 42%),
    repeating-conic-gradient(from 0deg,transparent 0 5deg,color-mix(in srgb,var(--brass) 95%,transparent) 5deg 8.5deg,transparent 8.5deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 42%,transparent 70%);
  mask-image:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 42%,transparent 70%);
  animation:raysIn 1.2s ease .25s both,spinC 26s linear 1.5s infinite}
.fx-stamp{font-family:var(--serif);font-size:clamp(30px,7vw,58px);margin:0;color:var(--brass);
  letter-spacing:.08em;text-shadow:0 4px 26px color-mix(in srgb,var(--brass) 55%,transparent);
  animation:stamp .6s cubic-bezier(.2,1.3,.4,1) .55s both}
@keyframes bossShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes raysIn{from{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0)}to{opacity:.38;transform:translate(-50%,-50%) scale(1) rotate(34deg)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.6);filter:blur(7px)}70%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
.is-dead .portrait img,.is-dead .fc-img img,.is-dead .bst-thumb img{filter:grayscale(1) brightness(.62)}
.is-dead .cc-body h3,.is-dead .bst-name{opacity:.72;text-decoration:line-through;text-decoration-thickness:1px}
.dead-badge{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;
  font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 12px;border-radius:999px;
  background:rgba(14,10,18,.85);color:#f0d9d9;border:1px solid color-mix(in srgb,var(--hp) 70%,transparent)}
@media (prefers-reduced-motion: reduce){
  .splash-ring,.splash-mark,.splash-txt,.splash-sub,.fx-rays,.fx-stamp,.fx-death .fx-img{animation:none!important}
  .fx-rays{opacity:.3}
}

/* ===== fundo, emblema e molduras por tema ===== */
.bg-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    radial-gradient(ellipse 60% 50% at 10% -8%,color-mix(in srgb,var(--brass) 16%,transparent),transparent 70%),
    radial-gradient(ellipse 50% 45% at 100% 105%,color-mix(in srgb,var(--mana) 14%,transparent),transparent 70%),
    repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 4%,transparent) 0 1px,transparent 1px 8px)}
.theme-art{position:fixed;left:0;right:0;bottom:0;height:min(40vh,400px);z-index:-1;pointer-events:none;opacity:.17;color:var(--text)}
.theme-art svg{width:100%;height:100%;display:block}
:root[data-skin="oeste"] .theme-art{opacity:.3;color:#6b4a28}
:root[data-skin="ordem"] .theme-art{opacity:.22;color:#8b5cf6}
:root[data-skin="hexatombe"] .theme-art{opacity:.3;color:#7d1219}
:root[data-skin="fantasy"] .theme-art{opacity:.22;color:#c9a227}
:root[data-skin="minecraft"] .theme-art{opacity:.26;color:#6b4a2a}
.scene-art{position:absolute;inset:0;z-index:0}
.scene-art svg{width:100%;height:100%;display:block}
.theme-mark{position:fixed;right:-3vw;top:14vh;width:min(34vw,400px);z-index:-1;pointer-events:none;opacity:.07;color:var(--brass)}
.theme-mark svg{width:100%;height:auto}
@media (max-width:760px){.theme-mark{width:78vw;opacity:.05}}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 12%,transparent)}

:root[data-skin="cores"] .bg-layer{background-image:
  radial-gradient(ellipse 55% 45% at 0% 0%,rgba(217,164,65,.14),transparent 62%),
  radial-gradient(ellipse 50% 40% at 100% 100%,rgba(79,176,198,.13),transparent 62%),
  repeating-linear-gradient(135deg,rgba(231,240,233,.035) 0 1px,transparent 1px 9px)}

:root[data-skin="oeste"] .bg-layer{background-image:
  repeating-linear-gradient(90deg,rgba(120,85,40,.06) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(0deg,rgba(120,85,40,.05) 0 1px,transparent 1px 7px),
  radial-gradient(ellipse at 50% 25%,rgba(255,244,218,.55),transparent 62%);
  box-shadow:inset 0 0 240px rgba(85,55,20,.4),inset 0 0 70px rgba(85,55,20,.2)}
:root[data-skin="oeste"] .theme-mark{opacity:.12;color:#5a3d21}
:root[data-skin="oeste"] .frame::after{box-shadow:inset 0 0 0 4px #f4ecd8,inset 0 0 0 7px #6d4a27,inset 0 0 44px rgba(85,55,20,.35)}
:root[data-skin="oeste"] .frame img{filter:sepia(.5) contrast(1.06) saturate(.92)}
:root[data-skin="oeste"] .login-card,:root[data-skin="oeste"] .modal{border-width:2px;border-color:#6d4a27}

:root[data-skin="ordem"] .bg-layer{background-image:
  radial-gradient(ellipse 65% 45% at 78% -5%,rgba(139,92,246,.24),transparent 65%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 46px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 46px);
  box-shadow:inset 0 0 240px rgba(0,0,0,.75)}
:root[data-skin="ordem"] .theme-mark{opacity:.12;color:#8b5cf6;right:auto;left:50%;transform:translateX(-50%);top:13vh;width:min(46vw,520px)}
:root[data-skin="ordem"] .frame{clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}
:root[data-skin="ordem"] .frame::after{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brass) 60%,transparent),inset 0 0 30px rgba(139,92,246,.3)}

:root[data-skin="hexatombe"] .bg-layer{background-image:
  radial-gradient(ellipse 72% 55% at 50% -12%,rgba(200,25,30,.4),transparent 66%),
  radial-gradient(circle at 12% 88%,rgba(150,12,18,.32),transparent 55%),
  repeating-linear-gradient(115deg,rgba(255,90,90,.055) 0 1px,transparent 1px 10px),

:root[data-skin="hexatombe"] .frame{clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 13px))}
:root[data-skin="hexatombe"] .frame::after{box-shadow:inset 0 0 0 2px #7d1219,inset 0 0 44px rgba(130,0,8,.6)}

:root[data-skin="fantasy"] .bg-layer{background-image:

:root[data-skin="fantasy"] .theme-mark{opacity:.13}
:root[data-skin="fantasy"] .frame::after{
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brass) 42%,transparent);
  background-image:linear-gradient(var(--brass),var(--brass)),linear-gradient(var(--brass),var(--brass)),
    linear-gradient(var(--brass),var(--brass)),linear-gradient(var(--brass),var(--brass)),
    linear-gradient(var(--brass),var(--brass)),linear-gradient(var(--brass),var(--brass)),
    linear-gradient(var(--brass),var(--brass)),linear-gradient(var(--brass),var(--brass));

  background-size:20px 2px,2px 20px,20px 2px,2px 20px,20px 2px,2px 20px,20px 2px,2px 20px;

:root[data-skin="minecraft"] .frame::after{box-shadow:inset 0 0 0 3px #17110c,inset 0 0 0 6px #6b4a2a,inset 0 0 0 9px #17110c}

/* ===== mensagens e pistas ===== */
.msg-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.msg-panel h2{font-size:19px;margin-bottom:4px}
.msg-panel .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.msg-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;max-height:320px;overflow-y:auto}
.msg-item{width:100%;text-align:left;display:grid;gap:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer}
.msg-item:hover{border-color:var(--brass)}
.msg-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.msg-kind{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.msg-kind.pista{color:var(--brass)}
.msg-kind.mensagem{color:var(--mana)}
.msg-to{margin-left:auto;font-size:11px}
.msg-text{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-item.unread{border-color:color-mix(in srgb,var(--brass) 60%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 18%,transparent)}
.post{position:fixed;inset:0;z-index:97;display:grid;place-items:center;padding:22px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 50%,rgba(10,8,16,.72),rgba(5,4,10,.94));animation:fxIn .35s ease both}
.post.out{animation:fxOut .55s ease forwards}
.post-card{position:relative;width:min(560px,94vw);max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:26px;box-shadow:var(--shadow);cursor:default;animation:postIn .55s cubic-bezier(.2,.9,.25,1) both}
.post.pista .post-card{border-color:color-mix(in srgb,var(--brass) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 35%,transparent),0 20px 60px rgba(0,0,0,.6)}
@keyframes postIn{0%{opacity:0;transform:translateY(26px) scale(.94)}100%{opacity:1;transform:none}}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.post-head h2{font-size:22px;flex:1}
.post-from{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.post-text{white-space:pre-wrap;font-size:16px;line-height:1.6;margin:0 0 16px}
.post-img{border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.post-img img{width:100%;display:block}
.post-seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--on-brass);background:var(--mana);flex:none}
.post.pista .post-seal{background:var(--brass)}
.post-seal svg{width:24px;height:24px}
.post-foot{display:flex;justify-content:flex-end;margin-top:18px}

/* ===== névoa de guerra ===== */
.fog{position:absolute;inset:0;pointer-events:none;z-index:2}
.fog i{position:absolute;display:block;background:#0b0a12}
.map-vp.fogging{cursor:cell}
.map-vp.fogging .fog i{background:repeating-linear-gradient(45deg,rgba(12,10,20,.72) 0 8px,rgba(30,26,44,.72) 8px 16px);outline:1px solid rgba(255,255,255,.05)}
.fog-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fog-tools .btn.sm{padding:5px 10px}

/* ===== Mesa 3D ===== */
.m3-wrap{display:grid;grid-template-columns:230px 1fr 300px;gap:18px;align-items:start}
.m3-wrap.no-side{grid-template-columns:1fr 320px}

  .m3-wrap>:last-child{grid-column:1/-1}
  .m3-wrap>.side-col,.m3-wrap>.dice-panel{position:static;max-height:none;overflow:visible}}
@media (max-width:1100px){.m3-wrap.no-side{grid-template-columns:1fr}.m3-wrap.no-side>:last-child{grid-column:auto}
  .m3-wrap>.side-col{position:static;max-height:none;overflow:visible}}
@media (max-width:900px){.m3-wrap{grid-template-columns:1fr}}
.m3-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.m3-panel+.m3-panel,.m3-panel+.dice-panel{margin-top:14px}
.m3-panel h2{font-size:18px;margin-bottom:8px}
.m3-panel .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.m3-h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;font-family:var(--sans);font-weight:700}
.m3-h3:first-of-type{margin-top:4px}
.m3-tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m3-tools-grid.b3{grid-template-columns:repeat(3,1fr)}
.m3-tool[disabled],.icon-btn[disabled]{opacity:.45;cursor:not-allowed}
.m3-cur{display:inline-flex;align-items:center;gap:7px;margin-left:auto;padding:5px 11px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--brass) 55%,var(--line));background:color-mix(in srgb,var(--brass) 14%,transparent);
  font-size:12px;font-weight:600;white-space:nowrap}
@media (max-width:620px){.m3-cur{margin-left:0}}
.m3-tool{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface2);cursor:pointer;font-size:13px;font-weight:500;text-align:left;min-width:0}
.m3-tool:hover{border-color:var(--brass)}
.m3-tool.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 22%,transparent);font-weight:600}
.m3-tool svg{width:14px;height:14px;flex:none}
.sw-g{width:13px;height:13px;border-radius:3px;background:var(--gc);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.m3-stage{min-width:0}
.m3-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.m3-host.edit{cursor:crosshair}
.m3-host.panning{cursor:grab}
.m3-host{position:relative;width:100%;height:min(66vh,640px);min-height:340px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);touch-action:none;cursor:grab;
  background:radial-gradient(ellipse 80% 70% at 50% 18%,color-mix(in srgb,var(--brass) 13%,transparent),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg))}
.m3-host:active{cursor:grabbing}
.m3-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.m3-labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.m3-lbl{position:absolute;top:0;left:0;display:grid;justify-items:center;gap:2px;will-change:transform}
.m3-lbl .n{font-size:11px;font-weight:600;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;
  padding:1px 7px;border-radius:999px;background:rgba(10,8,14,.78);color:#f2ead9}
.m3-lbl .hb{width:46px;height:4px;border-radius:99px;background:rgba(8,6,12,.8);overflow:hidden}
.m3-lbl .hb i{display:block;height:100%;background:#6bbf63}
.m3-lbl.foe .hb i{background:#d4483a}
.m3-lbl.dead .n{text-decoration:line-through;opacity:.7}
.m3-hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.m3-loading{display:grid;place-items:center;gap:14px;height:340px;color:var(--muted);font-family:var(--serif);font-size:19px;
  border:1px dashed var(--line);border-radius:14px;background:var(--surface2)}
.m3-spin{width:42px;height:42px;border-radius:50%;border:3px solid color-mix(in srgb,var(--brass) 25%,transparent);
  border-top-color:var(--brass);animation:spin 1s linear infinite}
.m3-turns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.m3-turns.empty-turns{color:var(--muted);font-size:13px}
.m3-round{font-family:var(--serif);font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--brass);color:var(--on-brass);white-space:nowrap}
.m3-turn-list{display:flex;gap:6px;overflow-x:auto;flex:1 1 320px;min-width:0;padding:2px}
.m3-turn{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface2);cursor:pointer;white-space:nowrap}
.m3-turn:hover{border-color:var(--brass)}
.m3-turn.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 25%,transparent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 35%,transparent)}
.m3-turn.is-dead{opacity:.55}
.m3-turn .bst-thumb{width:28px;height:28px;font-size:13px}
.m3-turn-n{font-size:13px;font-weight:600;display:grid;line-height:1.25}
.m3-turn-n small{font-weight:400;font-size:11px;color:var(--muted)}
.m3-sel{display:grid;gap:10px}
.m3-sel-head,.m3-obj-head{display:flex;align-items:center;gap:10px}
.m3-sel-head .bst-thumb{width:46px;height:46px}
.m3-sel-head small{display:block;font-size:12px;color:var(--muted)}
.m3-attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.m3-attr{position:relative;display:grid;gap:1px;padding:8px 6px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface2);text-align:center;font:inherit;color:inherit}
button.m3-attr{cursor:pointer}
button.m3-attr:hover{border-color:var(--brass)}
.m3-attr b{font-family:var(--serif);font-size:19px;line-height:1.1}
.m3-attr span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m3-attr .die-chip{position:absolute;top:-6px;right:-5px}
.m3-txt{margin:0;font-size:14px;white-space:pre-wrap;line-height:1.55}
.m3-secret{border:1px dashed color-mix(in srgb,var(--brass) 55%,transparent);border-radius:10px;padding:9px 11px;
  background:color-mix(in srgb,var(--brass) 10%,transparent)}
.m3-secret-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brass)}
.m3-secret p{margin:4px 0 0;font-size:13px;white-space:pre-wrap}
.m3-objs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.m3-roster{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.m3-rost{width:100%;display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface2);cursor:pointer;text-align:left}
.m3-rost:hover{border-color:var(--brass)}
.m3-rost.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 18%,transparent)}
.m3-rost .bst-thumb{width:34px;height:34px;flex:none;font-size:14px}
.m3-rost .rt{min-width:0}
.m3-rost strong{display:block;font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m3-rost small{display:block;font-size:11px;color:var(--muted)}
.m3-rost.dead{opacity:.6}
.m3-rost.dead strong{text-decoration:line-through}
.m3-rost.foe .bst-thumb{box-shadow:0 0 0 2px color-mix(in srgb,var(--hp) 55%,transparent)}
.m3-obj{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface2);cursor:pointer;font-size:13px;text-align:left}
.m3-obj:hover{border-color:var(--brass)}
.m3-obj.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 18%,transparent)}
.m3-obj.done{opacity:.7}
.m3-obj small{color:var(--muted)}
@media (max-width:900px){.m3-host{height:min(54vh,460px)}.m3-tools-grid{grid-template-columns:1fr 1fr 1fr}}

/* ===== dados dos atributos ===== */
.attr-edit{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--surface2)}
.attr-edit+.attr-edit{margin-top:8px}
.attr-edit .line{margin-bottom:9px}
.die-pick{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.die-pick .pl{font-size:12px;color:var(--muted);margin-right:2px}
.die-opt{position:relative;width:36px;height:36px;border:0;padding:0;background:none;cursor:pointer;
  display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);line-height:1}
.die-opt::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--text) 14%,transparent);transition:background .15s}
.die-opt>span{position:relative;z-index:1}
.die-opt:hover::before{background:color-mix(in srgb,var(--brass) 50%,transparent)}
.die-opt.on::before{background:var(--brass)}
.die-opt.on{color:var(--on-brass)}
.die-opt[data-shape="none"]::before{background:none;border:1px dashed var(--muted);border-radius:50%}
.die-opt[data-shape="none"].on::before{background:var(--brass);border-color:var(--brass)}
.die-opt[data-shape="d4"]::before{clip-path:polygon(50% 2%,98% 96%,2% 96%)}
.die-opt[data-shape="d6"]::before{clip-path:polygon(8% 8%,92% 8%,92% 92%,8% 92%)}
.die-opt[data-shape="d8"]::before{clip-path:polygon(50% 1%,99% 50%,50% 99%,1% 50%)}
.die-opt[data-shape="d10"]::before{clip-path:polygon(50% 0,96% 34%,76% 100%,24% 100%,4% 34%)}
.die-opt[data-shape="d12"]::before{clip-path:polygon(50% 0,95% 33%,78% 97%,22% 97%,5% 33%)}
.die-opt[data-shape="d20"]::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die-opt[data-shape="d100"]::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die-chip{position:relative;display:inline-grid;place-items:center;width:26px;height:26px;flex:none;
  font-size:8px;font-weight:700;color:var(--on-brass);line-height:1}
.die-chip::before{content:"";position:absolute;inset:0;background:var(--brass);opacity:.9}
.die-chip>span{position:relative;z-index:1}
.die-chip[data-shape="d4"]::before{clip-path:polygon(50% 2%,98% 96%,2% 96%)}
.die-chip[data-shape="d6"]::before{clip-path:polygon(8% 8%,92% 8%,92% 92%,8% 92%)}
.die-chip[data-shape="d8"]::before{clip-path:polygon(50% 1%,99% 50%,50% 99%,1% 50%)}
.die-chip[data-shape="d10"]::before{clip-path:polygon(50% 0,96% 34%,76% 100%,24% 100%,4% 34%)}
.die-chip[data-shape="d12"]::before{clip-path:polygon(50% 0,95% 33%,78% 97%,22% 97%,5% 33%)}
.die-chip[data-shape="d20"]::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die-chip[data-shape="d100"]::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die-chip.sm{width:22px;height:22px;font-size:7px}
.attr .die-chip{box-shadow:0 1px 4px rgba(0,0,0,.25)}
.attr{position:relative}
.attr .die-chip{position:absolute;top:6px;right:6px}
.attr.rollable{cursor:pointer;border:1px solid var(--line);width:100%;font:inherit;color:inherit}
.attr.rollable:hover{border-color:var(--brass)}
.attr.rollable:hover .die-chip::before{opacity:1}
.tag .die-chip{margin-left:4px;vertical-align:middle}
.tag{display:inline-flex;align-items:center}

/* ===== condições ===== */
.conds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cond{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
  border:1px solid color-mix(in srgb,var(--cc) 55%,transparent);background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--text)}
.cond .dot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
button.cond{cursor:pointer}
button.cond:hover{border-color:var(--cc)}
.cond.add{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.cond.add:hover{color:var(--brass);border-color:var(--brass)}
.cond-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cond-opt{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;text-align:left;font-size:14px}
.cond-opt .dot{width:11px;height:11px;border-radius:50%;background:var(--cc);flex:none}
.cond-opt.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 20%,transparent);font-weight:600}
.tk-conds{position:absolute;top:-3px;right:-3px;display:flex;gap:2px;z-index:4}
.tk-conds span{width:11px;height:11px;border-radius:50%;background:var(--cc);border:2px solid rgba(10,8,14,.8)}
.cc-conds{margin-top:2px}

/* ===== arena de combate ===== */
.arena-wrap{margin-bottom:26px}
.arena-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.arena-bar h2{font-size:20px}
.arena-hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.board-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.arena-board{position:relative;width:100%;min-width:560px;border-radius:16px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,#2a2b33,#15161c)}
.arena-board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(190,40,40,.16),transparent 38%,transparent 62%,color-mix(in srgb,var(--brass) 16%,transparent))}
.zone-tag{position:absolute;left:12px;z-index:3;font-size:12px;font-weight:700;letter-spacing:.08em;
  padding:3px 10px;border-radius:999px;background:rgba(10,8,14,.6);color:#f0e9dc;backdrop-filter:blur(3px)}
.zone-tag.foe{top:10px;border:1px solid color-mix(in srgb,var(--hp) 65%,transparent)}
.zone-tag.party{bottom:10px;border:1px solid color-mix(in srgb,var(--brass) 65%,transparent)}
.hex{position:absolute;width:var(--hw,11.7647%);height:var(--hh,25%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.hex::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(255,255,255,.18)}
.hex-in{position:absolute;inset:2px;z-index:1;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:rgba(255,255,255,.05);transition:background .18s}
.hex.z-foe .hex-in{background:rgba(190,45,45,.14)}
.hex.z-party .hex-in{background:color-mix(in srgb,var(--brass) 13%,transparent)}
.hex.drop{cursor:pointer}
.hex.drop .hex-in{background:color-mix(in srgb,var(--brass) 32%,transparent);animation:hexPulse 1.6s ease-in-out infinite}
@keyframes hexPulse{50%{background:color-mix(in srgb,var(--brass) 12%,transparent)}}
.token{position:relative;z-index:2;width:94%;border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.token[disabled]{cursor:default}
.tk-art{position:relative;width:72%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--brass);
  background:var(--surface2);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .18s}
.tk-art img{width:100%;height:100%;object-fit:cover}
.tk-initial{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--muted)}
.token:hover .tk-art{transform:translateY(-3px)}
.token.foe .tk-art{border-color:var(--hp)}
.token.mine .tk-art{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 35%,transparent),0 7px 16px rgba(0,0,0,.5)}
.token.boss .tk-art{width:80%}
.token.boss .tk-art{border-width:4px;box-shadow:0 0 0 3px color-mix(in srgb,var(--hp) 45%,transparent),0 0 22px color-mix(in srgb,var(--hp) 55%,transparent),0 8px 18px rgba(0,0,0,.5)}
.token.sel .tk-art{box-shadow:0 0 0 5px color-mix(in srgb,var(--brass) 60%,transparent),0 8px 18px rgba(0,0,0,.5)}
.token.is-dead .tk-art{border-color:var(--muted)}
.token.is-dead img{filter:grayscale(1) brightness(.55)}
.tk-hp{position:absolute;left:14%;right:14%;bottom:5px;height:5px;border-radius:99px;background:rgba(8,6,12,.75);overflow:hidden;z-index:3}
.tk-hp i{display:block;height:100%;background:var(--ok)}
.token.foe .tk-hp i{background:var(--hp)}
.tk-name{max-width:100%;font-size:10px;font-weight:600;white-space:nowrap;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;padding:0 6px;border-radius:999px;background:rgba(10,8,14,.72);color:#efe7da}
@media (max-width:760px){.tk-name{font-size:9px;padding:0 4px}}

.ctrl-list{display:grid;gap:10px}
.ctrl-row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ctrl-row.is-dead{opacity:.75}
.ctrl-row .bst-thumb{width:52px;height:52px}
.ctrl-main small{display:block;font-size:12px;color:var(--muted)}
.ctrl-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.ctrl-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.ctrl-row{grid-template-columns:52px 1fr}.ctrl-bars{grid-template-columns:1fr}.ctrl-actions{grid-column:1/-1;justify-content:flex-start}}

.play-layout{display:grid;grid-template-columns:240px 1fr 280px;gap:20px;align-items:start}
@media (max-width:1280px){.play-layout{grid-template-columns:240px 1fr}.play-layout .dice-panel{grid-column:1/-1}
  .play-layout>.side-col,.play-layout>.dice-panel{position:static;max-height:none;overflow:visible}}
@media (max-width:900px){.play-layout{grid-template-columns:1fr}}
.side-col{display:grid;gap:16px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.side-col::-webkit-scrollbar{width:8px}.side-col::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
@media (max-width:900px){.side-col{position:static;max-height:none;overflow:visible}}
.items-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.items-panel h2{font-size:19px;margin-bottom:4px}
.items-panel .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.item-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:340px;overflow-y:auto}
.item-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.item-row strong{font-size:14px;font-weight:600}
.item-row small{display:block;font-size:12px;color:var(--muted)}
.item-dmg{font-weight:700;color:var(--hp);font-size:14px;white-space:nowrap}
.item-owner{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.item-owner:first-child{margin-top:0}
.gm-layout.with-dice{grid-template-columns:260px 1fr 280px}
@media (max-width:1300px){.gm-layout.with-dice{grid-template-columns:270px 1fr}.gm-layout.with-dice .dice-panel{grid-column:1/-1}
  .gm-layout.with-dice>.side-col,.gm-layout.with-dice>.dice-panel{position:static;max-height:none;overflow:visible}}
@media (max-width:900px){.gm-layout.with-dice{grid-template-columns:1fr}}
.dice-panel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:1080px){.dice-panel{position:static;max-height:none;overflow:visible}}
.dice-panel h2{font-size:19px;margin-bottom:12px}
.dice-stage{display:grid;place-items:center;gap:8px;min-height:168px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);padding:14px;margin-bottom:14px;text-align:center}
.die{width:88px;height:88px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--brass) 85%,#fff),var(--brass));color:var(--on-brass);
  font-family:var(--serif);font-weight:700;font-size:30px;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.die[data-shape="d4"]{clip-path:polygon(50% 2%,98% 96%,2% 96%)}
.die[data-shape="d6"]{clip-path:polygon(6% 6%,94% 6%,94% 94%,6% 94%);border-radius:10px}
.die[data-shape="d8"]{clip-path:polygon(50% 1%,99% 50%,50% 99%,1% 50%)}
.die[data-shape="d10"]{clip-path:polygon(50% 0,96% 34%,76% 100%,24% 100%,4% 34%)}
.die[data-shape="d12"]{clip-path:polygon(50% 0,95% 33%,78% 97%,22% 97%,5% 33%)}
.die[data-shape="d20"]{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die[data-shape="d100"]{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die.rolling{animation:dieRoll .42s ease-in-out infinite}
@keyframes dieRoll{0%{transform:rotate(-14deg) scale(.94)}50%{transform:rotate(16deg) scale(1.06)}100%{transform:rotate(-14deg) scale(.94)}}
.die.landed{animation:dieLand .5s cubic-bezier(.2,1.5,.4,1)}
.dice-fx{position:fixed;inset:0;z-index:96;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 50%,rgba(10,8,16,.72),rgba(6,5,12,.93));text-align:center;animation:fxIn .3s ease both}
.dice-fx.out{animation:fxOut .5s ease forwards}
.dice-fx .splash-inner{gap:30px}
.dice-fx .die{width:150px;height:150px;font-size:54px}
.dice-fx .dice-total{font-size:52px;color:#f3ecdd}
.dice-fx .dice-detail{color:#bdb4c6;font-size:15px}
.dice-fx .splash-txt{color:#efe7da}
@keyframes dieLand{0%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.dice-total{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1}
.dice-detail{font-size:13px;color:var(--muted)}
.dice-idle{color:var(--muted);font-size:14px;max-width:24ch}
.dice-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.dice-btn{padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700;font-size:14px}
.dice-btn:hover{border-color:var(--brass);color:var(--brass)}
.dice-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 6px;background:var(--bg)}
.stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;line-height:1}
.stepper .sv{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.stepper .sl{font-size:11px;color:var(--muted);display:block;text-align:center;margin-bottom:4px}
.roll-log{list-style:none;margin:0;padding:0;display:grid;gap:7px;max-height:280px;overflow-y:auto}
.roll-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-size:13px}
.roll-item.mine{border-color:color-mix(in srgb,var(--brass) 55%,var(--line))}
.roll-item.new{animation:rollIn .5s ease}
@keyframes rollIn{from{opacity:0;transform:translateY(-6px)}}
.roll-who{font-weight:600}
.roll-what{color:var(--muted);font-size:12px}
.roll-total{font-family:var(--serif);font-size:20px;font-weight:700}

/* ===== configurações ===== */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.skin-card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;overflow:hidden}
.skin-card:hover{border-color:var(--brass)}
.skin-card.on{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 35%,transparent)}
.skin-swatch{display:flex;height:74px}
.skin-swatch span{flex:1}
.skin-swatch span:nth-child(3){flex:.6}
.skin-swatch span:nth-child(4){flex:.4}
.skin-name{font-family:var(--serif);font-weight:600;font-size:17px;padding:0 14px;display:flex;align-items:center;gap:8px}
.skin-on{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--brass);color:var(--on-brass)}
.skin-desc{font-size:13px;color:var(--muted);padding:0 14px;line-height:1.45}
.cfg-note{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:62ch}
.cfg-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:520px}
.cfg-box dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.cfg-box dt{color:var(--muted)}
.cfg-box dd{margin:0;font-weight:500}

*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text)}
body{background:transparent}
body{font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15}
.display{font-size:clamp(30px,4.6vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:18px}
.lede{color:var(--muted);max-width:60ch;margin:.4em 0 0}
.muted{color:var(--muted)}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg,.icon-btn svg{width:17px;height:17px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{border-color:var(--brass)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* topo */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:20px}
.brand svg{width:26px;height:26px;color:var(--brass)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;color:var(--muted);font-size:14px;overflow:hidden}
.crumbs a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.crumbs a:hover{color:var(--text)}
.crumbs .sep{opacity:.5}
.top-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500}
.user-chip .uname{padding-right:6px}
.role{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.role.master{background:var(--brass);color:var(--on-brass)}
.role.player{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.mode-badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
@media (max-width:760px){.crumbs{display:none}.user-chip .uname{display:none}.brand span{display:none}.topbar{justify-content:space-between}}

.main{padding:clamp(18px,3.5vw,40px) clamp(14px,3vw,32px) 80px;max-width:1240px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:34px 0 16px;flex-wrap:wrap}
.back{display:inline-block;color:var(--muted);font-size:14px;margin-bottom:16px}
.back:hover{color:var(--text)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px 22px;text-align:center;color:var(--muted);background:var(--surface2)}
.empty strong{display:block;color:var(--text);font-family:var(--serif);font-size:19px;margin-bottom:4px}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--serif);font-size:20px}

/* estante */
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;padding:0 4px;border-radius:6px}
.spine-slot{height:318px;display:flex;align-items:flex-end;padding:0 5px;border-bottom:14px solid var(--plank);box-shadow:0 6px 0 var(--plank-edge);margin-bottom:34px}
.spine-slot:first-child{padding-left:14px}
.spine-slot:last-child{padding-right:14px;flex:1 0 auto}
.spine{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:var(--w);height:var(--h);padding:14px 0;border-radius:4px 4px 2px 2px;background:
  linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.08) 18%,rgba(255,255,255,0) 40%,rgba(0,0,0,.18) 88%,rgba(0,0,0,.35)),var(--c);color:var(--t);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),2px 0 6px rgba(0,0,0,.25);transition:transform .25s ease;cursor:pointer}
.spine:hover,.spine:focus-visible{transform:translateY(-14px)}
.band{width:78%;height:9px;border-top:2px solid color-mix(in srgb,var(--t) 55%,transparent);border-bottom:2px solid color-mix(in srgb,var(--t) 55%,transparent)}
.spine-title{writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:var(--fs,19px);letter-spacing:.02em;flex:1;display:flex;align-items:center;padding:12px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-height:calc(var(--h) - 90px)}
.spine-count{font-size:12px;opacity:.8;font-weight:600}
.spine.add{background:transparent;border:2px dashed var(--muted);color:var(--muted);box-shadow:none;justify-content:center;gap:10px}
.spine.add:hover{color:var(--brass);border-color:var(--brass)}
.spine.add svg{width:22px;height:22px}
.spine.add .spine-title{flex:none;max-height:none;font-size:16px;padding:0}

/* biblioteca */
.lib-hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:start}
.lib-mark{width:54px;height:128px;border-radius:4px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.1) 25%,rgba(0,0,0,.3)),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.lib-meta{margin-top:12px;font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
@media (max-width:760px){.lib-hero{grid-template-columns:auto 1fr}.lib-hero .row{grid-column:1/-1}.lib-mark{height:90px;width:40px}}
.camp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.camp-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.camp-card:hover{border-color:var(--brass)}
.camp-cover{aspect-ratio:16/8;background:var(--bg2);position:relative;overflow:hidden}
.camp-cover img{width:100%;height:100%;object-fit:cover}
.cover-fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:54px;font-weight:700;color:color-mix(in srgb,var(--c,var(--brass)) 70%,var(--text));background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c,var(--brass)) 35%,transparent),transparent 70%),var(--bg2)}
.camp-body{padding:16px 18px 18px}
.camp-body p{margin:6px 0 0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.camp-stats{margin-top:12px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* campanha */
.camp-hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-bottom:22px}
.camp-hero .hero-img{height:clamp(140px,24vw,240px);overflow:hidden;background:var(--bg2)}
.camp-hero .hero-img img{width:100%;height:100%;object-fit:cover}
.camp-hero-text{padding:20px 22px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
.camp-hero-text p{margin:6px 0 0;color:var(--muted);max-width:70ch;white-space:pre-wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{padding:11px 16px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--brass)}
.tab .n{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 7px}

/* cards de personagem / monstro */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.char-card,.mon-card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.char-card:hover{border-color:var(--brass)}
.char-card.mine{border-color:color-mix(in srgb,var(--brass) 60%,var(--line))}
.portrait{aspect-ratio:4/5;background:var(--bg2);position:relative;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover}
.initial{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:64px;font-weight:700;color:var(--muted);background:radial-gradient(circle at 50% 30%,var(--surface2),var(--bg2))}
.cc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cc-body h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-sub{font-size:14px;color:var(--muted);margin-top:-4px}
.owner{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(4px);border:1px solid var(--line)}
.owner.you{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.mon-card.off{opacity:.78}
.mon-card.off .portrait img{filter:grayscale(.7)}
.vis{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;align-self:flex-start}
.vis svg{width:15px;height:15px}
.vis.on{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.unknown{font-style:italic;color:var(--muted)}

/* barras */
.stat{display:flex;flex-direction:column;gap:5px}
.stat-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.stat-top .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.stat.hp .bar i{background:var(--hp)}
.stat.mana .bar i{background:var(--mana)}
.adj{display:flex;gap:4px;margin-top:2px}
.adj button{flex:1;padding:4px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.adj button:hover{border-color:var(--brass)}

/* ficha */
.sheet-grid{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
@media (max-width:860px){.sheet-grid{grid-template-columns:1fr}}
.sheet-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
@media (max-width:860px){.sheet-side{position:static}}
.sheet-side .portrait{border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px}
.sheet-head .cc-sub{margin-top:6px;font-size:16px}
.block{margin-top:30px}
.block h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.block h2::after{content:"";flex:1;height:1px;background:var(--line)}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.attr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.attr .av{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.1;word-break:break-word}
.attr .an{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--surface2);font-size:13px}
tr:last-child td{border-bottom:0}
td.dmg{font-weight:600;color:var(--hp);white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field .fl{font-size:13px;color:var(--muted)}
.field .fv{white-space:pre-wrap;word-break:break-word}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:75ch}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery .g{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);cursor:zoom-in;padding:0}
.gallery .g img{width:100%;height:100%;object-fit:cover}

/* mapa */
.map-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.map-tabs{display:flex;gap:6px;flex-wrap:wrap}
.map-tabs .chip.on{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--brass)}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.size-ctl .sl{font-size:11px;color:var(--muted);display:block;text-align:center;margin-bottom:3px}
.size-ctl .stepper{padding:3px 6px}
.btn.toggle-on{background:var(--brass-soft);border-color:var(--brass);color:var(--text)}
.map-hint{margin:0 0 10px;font-size:14px;color:var(--muted)}
.map-vp{position:relative;height:min(72vh,760px);border-radius:14px;border:1px solid var(--line);background:
  radial-gradient(circle,var(--line) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg2);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map-vp.panning{cursor:grabbing}
.map-vp.editing{cursor:crosshair}
.map-inner{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;--inv:1}
.map-inner img{width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.wp{position:absolute;transform:translate(-50%,-100%) scale(var(--inv));transform-origin:50% 100%;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.wp-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);display:grid;place-items:center}
.wp-pin::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.wp-label{order:-1;margin-bottom:6px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:6px;background:rgba(20,18,34,.82);color:#f3eee2;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.wp:hover .wp-label,.wp:focus-visible .wp-label,.map-vp.labels .wp-label{opacity:1}
.map-vp.editing .wp{cursor:move}
.wp-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.wp-list .chip{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px var(--surface)}

/* modal */
#overlay:empty,#confirm:empty,#lightbox:empty{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,10,24,.6);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}
#confirm .scrim{z-index:70}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.modal.wide{width:min(900px,100%)}
.modal.small{width:min(420px,100%)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{flex:1;font-size:21px}
.modal-scroll{overflow-y:auto;padding:20px;flex:1}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.modal footer .spacer{flex:1}
@media (max-width:600px){.scrim{padding:0;align-items:stretch}.modal,.modal.wide,.modal.small{max-height:100vh;height:100%;border-radius:0;width:100%}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;margin-bottom:14px}
label.f small{font-weight:400;color:var(--muted)}
.inp{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-width:0}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 25%,transparent)}
textarea.inp{resize:vertical;min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-sec{border-top:1px solid var(--line);padding-top:18px;margin-top:6px;margin-bottom:18px}
.ed-sec h3{font-size:17px;margin-bottom:4px}
.ed-sec .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.ed-top{display:grid;grid-template-columns:150px 1fr;gap:18px;margin-bottom:12px}
@media (max-width:600px){.ed-top{grid-template-columns:1fr}.ed-top .pick{max-width:170px}}
.pick{aspect-ratio:4/5;border-radius:12px;border:2px dashed var(--line);background:var(--bg2);display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;color:var(--muted);font-size:13px;text-align:center;padding:0}
.pick:hover{border-color:var(--brass)}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick.wide{aspect-ratio:16/7;width:100%}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:8px;align-items:center}
.line.attr-l{grid-template-columns:1fr 110px 36px}
.line.item-l{grid-template-columns:1.4fr 70px 110px 1.4fr 36px}
.line.field-l{grid-template-columns:1fr 1.6fr 36px}
.line-head{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:600px){.line.item-l{grid-template-columns:1fr 70px 36px}.line.item-l .i-dmg,.line.item-l .i-notes{grid-column:1/3}.line-head.item-l{display:none}}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.x:hover{color:var(--danger);border-color:var(--danger)}
.x svg{width:16px;height:16px}
.add-line{margin-top:10px}
.cs{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface2)}
.cs-head{display:grid;grid-template-columns:1fr 36px;gap:8px;margin-bottom:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;background:rgba(20,18,34,.75);color:#fff;border:0}
.thumb.add{display:grid;place-items:center;border-style:dashed;cursor:pointer;color:var(--muted);font-size:13px;background:transparent}
.thumb.add:hover{border-color:var(--brass);color:var(--brass)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw.round{border-radius:50%}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;margin-bottom:10px}
.switch input{width:40px;height:22px;appearance:none;-webkit-appearance:none;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:21px}
.wp-desc{white-space:pre-wrap;margin:0 0 16px}
.uploading{font-size:13px;color:var(--brass);margin-top:6px}

/* modo jogo */
.modes{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:none}
.mode{padding:5px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.mode:hover{color:var(--text)}
.mode.on{background:var(--brass);color:var(--on-brass)}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode svg{width:15px;height:15px}
@media (max-width:900px){.mode-txt{display:none}}
@media (max-width:760px){.mode-badge{display:none}.mode{padding:5px 9px}.topbar{gap:8px}.top-right{gap:6px}}
@media (max-width:480px){.user-chip{display:none}.brand{display:none}}
@media (max-width:600px){.arena-grid:not(.one){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fc-body{padding:10px}}
.game-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.camp-select{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.camp-select select{width:auto;min-width:210px}
.game-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.pick-char{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.pick-char:hover{border-color:var(--brass)}
.pick-char.on{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 35%,transparent)}
.pick-char strong{display:block;font-size:15px}
.pick-char small{color:var(--muted);font-size:12px}
.pc-thumb,.bst-thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:700;color:var(--muted)}
.pc-thumb img,.bst-thumb img{width:100%;height:100%;object-fit:cover}
.arena{border-radius:16px;margin-bottom:26px}
.empty-arena{border:1px dashed var(--line);padding:16px 20px;color:var(--muted);background:var(--surface2)}
.empty-arena p{margin:0}
.arena.live{border:1px solid color-mix(in srgb,var(--hp) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--hp) 11%,var(--surface)),var(--surface));padding:16px}
.arena-head{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--hp);margin-bottom:12px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--hp);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.arena-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.arena-grid.one{grid-template-columns:1fr}
.field-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fc-img{aspect-ratio:1;background:var(--bg2);position:relative;cursor:zoom-in}
.fc-img img{width:100%;height:100%;object-fit:cover}
.fc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.fc-note{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.field-card.solo{flex-direction:row}
.field-card.solo .fc-img{width:min(320px,42%);aspect-ratio:4/5;flex:none}
.field-card.solo .fc-body{flex:1;padding:22px;gap:14px;justify-content:center}
.field-card.solo h3{font-size:clamp(24px,3.4vw,38px)}
.field-card.solo .bar{height:14px}
.field-card.solo .stat-top{font-size:15px}
@media (max-width:600px){.field-card.solo{flex-direction:column}.field-card.solo .fc-img{width:100%;aspect-ratio:4/3}}
.game-sheet{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:26px;align-items:start}
@media (max-width:760px){.game-sheet{grid-template-columns:1fr}.gs-portrait{max-width:300px}}
.gs-portrait .portrait{border-radius:16px;border:1px solid var(--line)}
.gs-portrait[data-action] .portrait{cursor:zoom-in}
.gs-name{font-size:clamp(30px,4.4vw,48px);font-weight:700}
.gs-title .cc-sub{margin-top:6px;font-size:17px}
.gs-stats{display:flex;flex-direction:column;gap:16px;margin:20px 0 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.gs-stats .stat-top{font-size:16px}
.gs-stats .bar{height:16px}
.gs-stats .adj button{padding:8px 0;font-size:15px}
.gs-attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gs-attrs .av{font-size:34px}
.gm-layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.gm-layout{grid-template-columns:1fr}}
.gm-bestiary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto}
@media (max-width:900px){.gm-bestiary{position:static;max-height:none}}
.gm-panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.gm-panel-head h2{font-size:19px}
.bst-row{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent}
.bst-row+.bst-row{margin-top:4px}
.bst-row.on{border-color:color-mix(in srgb,var(--hp) 50%,var(--line));background:color-mix(in srgb,var(--hp) 8%,transparent)}
.bst-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bst-name small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.field-toggle{grid-column:1/-1;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600;font-size:13px}
.field-toggle:hover{border-color:var(--hp)}
.field-toggle.on{background:var(--hp);border-color:var(--hp);color:#fff}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.party-card{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.party-card:hover{border-color:var(--brass)}
.party-card .bst-thumb{width:52px;height:64px}
.party-card strong{display:block}
.party-card small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.party-card .stat{margin-top:6px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--brass) 18%,transparent),transparent 55%),
  radial-gradient(ellipse at 100% 100%,color-mix(in srgb,var(--mana) 14%,transparent),transparent 50%)}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow)}
.login-mark svg{width:46px;height:46px;color:var(--brass)}
.login-card h1{margin-top:12px}
.login-card form{margin-top:24px}
.login-err{color:var(--danger);font-size:14px;margin:-4px 0 12px}
.quick{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.quick p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.quick .row{gap:6px}

/* lightbox e toast */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,6,16,.92);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fade .2s ease;max-width:90vw}
.toast.err{background:var(--danger);color:#fff}
</style>

function ls(k, v) {

}

function textOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;

}

/* =========================================================
   Armazenamento: banco compartilhado (db) ou modo local
   ========================================================= */
let store = null;
function makeDbStore(db) {
  return {
    watch(col, cb, onErr) {
      return db.collection(col).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
    },
    set: (col, id, data) => db.doc(col + '/' + id).set(data),
    update: (col, id, data) => db.doc(col + '/' + id).update(data),
    remove: (col, id) => db.doc(col + '/' + id).delete(),
    async getImage(id) { const s = await db.doc('images/' + id).get(); return s.exists ? s.data().data : null; },
    putImage: (id, data) => db.doc('images/' + id).set({ data, createdAt: Date.now() }),
    delImage: id => db.doc('images/' + id).delete()
  };
}
function makeLocalStore() {
  let mem = {};
  try { mem = JSON.parse(ls('grimorio-local') || '{}') || {}; } catch (e) { mem = {}; }
  COLS.concat('images').forEach(c => { mem[c] = mem[c] || {}; });
  const L = {};
  let warned = false;
  const persist = () => {
    try { localStorage.setItem('grimorio-local', JSON.stringify(mem)); }
    catch (e) { if (!warned) { warned = true; toast('O navegador ficou sem espaço para guardar tudo. As mudanças valem até recarregar.', 'err'); } }
  };
  const emit = c => (L[c] || []).forEach(cb => cb(Object.entries(mem[c]).map(([id, d]) => ({ id, ...d }))));
  return {
    watch(c, cb) { (L[c] = L[c] || []).push(cb); setTimeout(() => emit(c)); return () => {}; },
    async set(c, id, d) { mem[c][id] = clone(d); persist(); emit(c); },
    async update(c, id, d) { mem[c][id] = { ...mem[c][id], ...clone(d) }; persist(); emit(c); },
    async remove(c, id) { delete mem[c][id]; persist(); emit(c); },
    async getImage(id) { return mem.images[id]?.data || null; },
    async putImage(id, data) { mem.images[id] = { data }; persist(); },
    async delImage(id) { delete mem.images[id]; persist(); }
  };
}
