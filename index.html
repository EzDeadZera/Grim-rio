const imgCache = new Map();
function refSrc(ref) {
  if (!ref) return '';
  if (ref.startsWith('a:')) return '/_blob/' + ref.slice(2);
  const c = imgCache.get(ref);
  return typeof c === 'string' ? c : '';
}
function imgTag(ref, alt = '', cls = '') {
  if (!ref) return '';
  const src = refSrc(ref);
  return `<img ${cls ? `class="${cls}"` : ''} data-ref="${esc(ref)}" ${src ? `src="${esc(src)}"` : ''} alt="${esc(alt)}" loading="lazy" draggable="false">`;
}
function hydrateImages(root) {
  root.querySelectorAll('img[data-ref^="d:"]').forEach(img => {
    if (img.getAttribute('src')) return;
    const ref = img.dataset.ref;
    let p = imgCache.get(ref);
    if (!p) {
      p = store.getImage(ref.slice(2)).then(d => { imgCache.set(ref, d || ''); return d; }).catch(() => { imgCache.delete(ref); return null; });
      imgCache.set(ref, p);
    }
    Promise.resolve(p).then(d => { if (d) img.src = d; });
  });
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não consegui abrir essa imagem.')); };
    im.src = url;
  });
}
let webpOk = null;
function canWebp() {
  if (webpOk === null) { const c = document.createElement('canvas'); c.width = c.height = 1; webpOk = c.toDataURL('image/webp').startsWith('data:image/webp'); }
  return webpOk;
}
function drawScaled(im, maxDim) {
  const k = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.naturalWidth * k));
  c.height = Math.max(1, Math.round(im.naturalHeight * k));
  const g = c.getContext('2d');
  if (!canWebp()) { g.fillStyle = '#1d1b30'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(im, 0, 0, c.width, c.height);
  return c;
}
async function saveImage(file, kind) {
  if (!file.type.startsWith('image/')) throw new Error('Escolha um arquivo de imagem (PNG, JPG, WEBP ou GIF).');
  const im = await loadImage(file);
  const type = canWebp() ? 'image/webp' : 'image/jpeg';
  if (S.assets) {
    try {
      const c = drawScaled(im, kind === 'map' ? 3200 : 1600);
      const isPng = file.type === 'image/png' && kind === 'map';
      const blob = await new Promise(r => c.toBlob(r, isPng ? 'image/png' : type, 0.9));
      let finalBlob = blob;
      if (isPng && blob.size > 15e6) finalBlob = await new Promise(r => c.toBlob(r, type, 0.9));
      const up = await S.assets.upload(finalBlob, { type: finalBlob.type });
      return 'a:' + up.id;
    } catch (e) { console.warn('Upload de arquivo falhou, usando o banco', e); }
  }
  let dim = kind === 'map' ? 2000 : 1100, q = 0.86, data = '';
  for (let i = 0; i < 12; i++) {
    data = drawScaled(im, dim).toDataURL(type, q);
    if (data.length < 235000) break;
    if (q > 0.6) q -= 0.08; else dim = Math.round(dim * 0.82);
  }
  if (data.length >= 250000) throw new Error('A imagem ficou grande demais mesmo comprimida. Tente uma menor.');
  const id = uid();
  await store.putImage(id, data);
  imgCache.set('d:' + id, data);
  return 'd:' + id;
}
function deleteImageRef(ref) {
  if (!ref) return;
  if (ref.startsWith('d:')) store.delImage(ref.slice(2)).catch(() => {});
  else if (ref.startsWith('a:') && S.assets) S.assets.delete(ref.slice(2)).catch(() => {});
}
function pickFiles(multiple) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !!multiple;
    inp.style.display = 'none';
    inp.onchange = () => { res([...inp.files]); inp.remove(); };
    document.body.appendChild(inp);
    inp.click();
  });
}
function sheetRefs(o) { return [o?.portrait, ...(o?.gallery || [])].filter(Boolean); }
function mapRefs(m) { return [m?.image, ...(m?.waypoints || []).flatMap(w => w.images || [])].filter(Boolean); }

/* =========================================================
   Rotas
   ========================================================= */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  return { view: h[0] || '', id: h[1] ? decodeURIComponent(h[1]) : '', tab: h[2] || '' };
}
function go(h) { if (location.hash === h) render(); else location.hash = h; }
addEventListener('resize', () => { if (route().view === 'mesa') m3Tick(); });
window.addEventListener('hashchange', () => { closeLightbox(); window.scrollTo(0, 0); render(); });

let raf = 0;
function scheduleRender() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  const app = $('#app');
  if (S.drag || S.rolling) { S.renderAfterDrag = true; return; }
  if (!S.user) { if (!app.querySelector('.login')) { app.innerHTML = loginView(); setTimeout(() => $('#lu')?.focus()); } return; }
  if (!S.ready) { app.innerHTML = shell('<div class="loading">Abrindo o grimório…</div>', []); return; }
  const r = route();
  let v;
  if (r.view === 'b') v = libraryView(r.id);
  else if (r.view === 'c') v = campaignView(r.id, r.tab || 'fichas');
  else if (r.view === 'p') v = characterView(r.id);
  else if (r.view === 'm') v = monsterView(r.id);
  else if (r.view === 'jogo') v = gameView();
  else if (r.view === 'mesa') v = mesaView();
  else if (r.view === 'config') v = settingsView(r.id || 'tema');
  else v = shelfView();
  app.innerHTML = shell(v.html, v.crumbs === null ? null : (v.crumbs || []));
  hydrateImages(app);
  if (v.after) v.after();
}

function getStat(col, o, stat) {
  const base = o[stat] || { cur: 0, max: 0 };
  const k = `${col}:${o.id}:${stat}`;
  return k in S.adj ? { cur: S.adj[k], max: base.max } : { cur: num(base.cur), max: num(base.max) };
}
function statBar(col, o, stat, label, opts = {}) {
  const st = getStat(col, o, stat);
  const pct = st.max > 0 ? clamp(st.cur / st.max * 100, 0, 100) : (st.cur > 0 ? 100 : 0);
  const steps = opts.big ? [-5, -1, 1, 5] : [-1, 1];
  return `<div class="stat ${stat}">
    <div class="stat-top"><span>${esc(label)}</span><span class="v">${st.cur}${st.max ? ' / ' + st.max : ''}</span></div>
    <div class="bar" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${st.max}" aria-valuenow="${st.cur}"><i style="width:${pct}%"></i></div>
    ${opts.adj ? `<div class="adj">${steps.map(d => `<button data-action="adj" data-col="${col}" data-id="${esc(o.id)}" data-stat="${stat}" data-d="${d}" aria-label="${esc(label)} ${d > 0 ? '+' : ''}${d}">${d > 0 ? '+' : '−'}${Math.abs(d)}</button>`).join('')}</div>` : ''}
  </div>`;
}
function adjust(col, id, stat, d) {
  const o = get(col, id); if (!o) return;
  const st = getStat(col, o, stat);
  let cur = Math.max(0, st.cur + d);
  if (st.max > 0) cur = Math.min(cur, st.max);
  const k = `${col}:${id}:${stat}`;
  S.adj[k] = cur; scheduleRender();
  clearTimeout(S.adjT[k]);
  S.adjT[k] = setTimeout(async () => {
    try { await store.update(col, id, { [stat]: { cur, max: st.max } }); }
    catch (e) { toast('Não foi possível salvar o valor. Tente de novo.', 'err'); }
    finally { if (S.adj[k] === cur) delete S.adj[k]; scheduleRender(); }
  }, 450);
}

/* =========================================================
   Ficha (leitura)
   ========================================================= */
function sheetBody(o) {
  const attrs = (o.attrs || []).filter(a => a.name || a.value);
  const items = (o.items || []).filter(i => i.name);
  const secs = (o.sections || []).filter(s => s.title || (s.fields || []).length);
  const gal = o.gallery || [];
  let h = '';

const FOG_COLS = 24, FOG_ROWS = 16, FOG_N = FOG_COLS * FOG_ROWS;
function fogOf(map) {
  const raw = typeof map?.fog === 'string' ? map.fog : '';
  return raw.length === FOG_N ? raw : '0'.repeat(FOG_N);
}
function fogCells(map, master) {
  const f = fogOf(map);
  if (f.indexOf('1') < 0) return '';
  const w = 100 / FOG_COLS, h = 100 / FOG_ROWS;
  let out = '';
  for (let i = 0; i < FOG_N; i++) {
    if (f[i] !== '1') continue;
    const r = Math.floor(i / FOG_COLS), c = i % FOG_COLS;
    out += `<i style="left:${(c * w).toFixed(4)}%;top:${(r * h).toFixed(4)}%;width:${(w + 0.06).toFixed(4)}%;height:${(h + 0.06).toFixed(4)}%"></i>`;
  }
  return out;
}
function fogHides(map, w) {
  const f = fogOf(map);
  if (f.indexOf('1') < 0) return false;
  const c = clamp(Math.floor(num(w.x) / (100 / FOG_COLS)), 0, FOG_COLS - 1);
  const r = clamp(Math.floor(num(w.y) / (100 / FOG_ROWS)), 0, FOG_ROWS - 1);
  return f[r * FOG_COLS + c] === '1';
}
let fogSaveT = 0;
function paintFog(p) {
  const map = curMap(); if (!map) return;
  const c = clamp(Math.floor(p.x / (100 / FOG_COLS)), 0, FOG_COLS - 1);
  const r = clamp(Math.floor(p.y / (100 / FOG_ROWS)), 0, FOG_ROWS - 1);
  const i = r * FOG_COLS + c;
  const want = S.fogBrush === 'reveal' ? '0' : '1';
  const cur = S.fogDraft || fogOf(map);
  if (cur[i] === want) return;
  S.fogDraft = cur.slice(0, i) + want + cur.slice(i + 1);
  const host = document.getElementById('mapfog');
  if (host) host.innerHTML = fogCells({ fog: S.fogDraft }, true);
  clearTimeout(fogSaveT);
  fogSaveT = setTimeout(() => {
    const fog = S.fogDraft; S.fogDraft = null;
    store.update('maps', map.id, { fog }).catch(() => toast('Não foi possível salvar a névoa.', 'err'));
  }, 420);
}
function curMap() { return get('maps', S.mapId); }
function setupMap() {
  const vp = $('#mapvp'), inner = $('#mapinner'); if (!vp) return;
  const v = S.mapView;
  const apply = () => { inner.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s})`; inner.style.setProperty('--inv', (1 / v.s).toFixed(4)); };
  const fit = () => {
    const img = $('#mapimg'); if (!img || !img.naturalWidth) return;
    const r = vp.getBoundingClientRect(); const h = r.width * img.naturalHeight / img.naturalWidth;
    const s = Math.min(1, r.height / h);
    v.s = s; v.x = (r.width - r.width * s) / 2; v.y = Math.max(0, (r.height - h * s) / 2); apply();
  };
  const zoomAt = (ns, cx, cy, b) => {
    const r = vp.getBoundingClientRect(); const px = cx - r.left, py = cy - r.top;
    b = b || { s: v.s, vx: v.x, vy: v.y };
    const ix = (px - b.vx) / b.s, iy = (py - b.vy) / b.s;
    v.s = ns; v.x = px - ix * ns; v.y = py - iy * ns; apply();
  };
  S.mapZoom = z => {
    const r = vp.getBoundingClientRect();
    if (z === 'fit') return fit();
    zoomAt(clamp(v.s * (z === 'in' ? 1.3 : 1 / 1.3), .3, 8), r.left + r.width / 2, r.top + r.height / 2);
  };
  const img = $('#mapimg');
  if (!S.mapFitted) {
    const doFit = () => { if (v.s === 1 && v.x === 0 && v.y === 0) fit(); S.mapFitted = true; };
    if (img && img.complete && img.naturalWidth) doFit(); else img?.addEventListener('load', doFit, { once: true });
  }
  apply();
  const pctFromClient = (cx, cy) => {
    const r = $('#mapimg').getBoundingClientRect();
    return { x: +clamp((cx - r.left) / r.width * 100, 0, 100).toFixed(2), y: +clamp((cy - r.top) / r.height * 100, 0, 100).toFixed(2), inside: cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom };
  };
  const pts = new Map();
  let start = null, moved = false, pinch = null, dragWp = null;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  vp.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const wpEl = e.target.closest('.wp');
    if (pts.size === 1) {
      start = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y, wp: wpEl ? wpEl.dataset.wp : null };
      moved = false;
      if (isMaster() && S.fogMode) {
        start.fog = true; S.drag = true;
        const p = pctFromClient(e.clientX, e.clientY);
        if (p.inside) paintFog(p);
        return;
      }
      if (wpEl && isMaster() && S.mapEdit) { dragWp = { id: wpEl.dataset.wp, el: wpEl, p: null }; S.drag = true; }
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: dist(a, b) || 1, s: v.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: v.x, vy: v.y };
      start = null; if (dragWp) { dragWp = null; S.drag = false; }
    }
  });
  vp.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      zoomAt(clamp(pinch.s * dist(a, b) / pinch.d, .3, 8), pinch.cx, pinch.cy, pinch); moved = true; return;
    }
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    if (start.fog) { const p = pctFromClient(e.clientX, e.clientY); if (p.inside) paintFog(p); return; }
    if (dragWp) { const p = pctFromClient(e.clientX, e.clientY); dragWp.el.style.left = p.x + '%'; dragWp.el.style.top = p.y + '%'; dragWp.p = p; }
    else { v.x = start.vx + dx; v.y = start.vy + dy; apply(); vp.classList.add('panning'); }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); vp.classList.remove('panning');
    if (pinch) { if (pts.size < 2) pinch = null; start = null; return; }
    if (!start) return;
    const s = start; start = null;
    if (s.fog) { S.drag = false; if (S.renderAfterDrag) { S.renderAfterDrag = false; scheduleRender(); } return; }
    if (dragWp) {
      const d = dragWp; dragWp = null; S.drag = false;
      if (e.type === 'pointercancel') { if (S.renderAfterDrag) { S.renderAfterDrag = false; scheduleRender(); } return; }
      if (moved && d.p) moveWaypoint(d.id, d.p); else openWaypoint(d.id);
      if (S.renderAfterDrag) { S.renderAfterDrag = false; scheduleRender(); }
      return;
    }
    if (moved || e.type === 'pointercancel') return;
    if (s.wp) { openWaypoint(s.wp); return; }
    if (S.mapEdit && isMaster()) { const p = pctFromClient(e.clientX, e.clientY); if (p.inside) newWaypoint(p); }
  };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
  vp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(clamp(v.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), .3, 8), e.clientX, e.clientY); }, { passive: false });
  vp.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.wp')) { e.preventDefault(); openWaypoint(e.target.closest('.wp').dataset.wp); } });
}

const COLS_MIN = 4, COLS_MAX = 10, ROWS_MIN = 3, ROWS_MAX = 7;
function gridOf(camp) {

   Mesa 3D — cena isométrica montada pelo mestre

const M3_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'

const M3_GROUND = {
  p: ['Pedra', 0x76757e], m: ['Madeira', 0x8a5a30], g: ['Grama', 0x4f7a3c],
  s: ['Areia', 0xc0a468], a: ['Água', 0x2f6f94], c: ['Tapete', 0x8c3630], '.': ['Vazio', 0x14121a]
};
const M3_GORDER = ['p', 'm', 'g', 's', 'a', 'c', '.'];
const M3_PROPS = {
  t: ['Tocha', 0xffb347, 0], x: ['Caixa', 0x9a6a38, 1], b: ['Baú', 0xc08b3a, 1],
  e: ['Mesa', 0x7d5531, 1], l: ['Pilar', 0x8d8a96, 1], v: ['Arbusto', 0x4a7a40, 0],
  d: ['Porta', 0x6b4426, 1], r: ['Rocha', 0x6a6873, 1]
};
const M3_KINDS = { pista: ['Pista', 0xd8b060], enigma: ['Enigma', 0x9b6cf6], npc: ['NPC', 0x3ecf8e] };
const M3_SIZES = [[12, 9], [16, 12], [20, 15], [24, 18]];

const M3 = {
  lib: null, loading: false, failed: false,
  renderer: null, scene: null, cam: null, host: null, labels: null, raf: 0,
  ground: null, walls: null, marks: null, deco: [], objs: [], tokens: new Map(),
  terrainSig: '', tokenSig: '', objSig: '',
  yaw: Math.PI / 4, pitch: 0.68, zoom: 1, tx: 0, tz: 0, needFit: true,
  sel: null, reach: new Map(), hover: null, draft: null, flushT: 0,
  wired: false, tool: 'p', grid: true, lastW: 0, lastH: 0,
  brush: 0, rect: false, rectFrom: null, hoverCell: null, ghost: null, undo: [], space: false
};
const m3Idx = (sc, x, y) => y * sc.w + x;
const m3In = (sc, x, y) => x >= 0 && y >= 0 && x < sc.w && y < sc.h;
const m3G = (sc, x, y) => (sc.ground || '')[m3Idx(sc, x, y)] || 'p';
const m3H = (sc, x, y) => num((sc.height || '')[m3Idx(sc, x, y)] || '0');
const m3Prop = (sc, x, y) => (sc.props || {})[x + ',' + y] || '';
function m3Walk(sc, x, y) {
  if (!m3In(sc, x, y) || m3G(sc, x, y) === '.' || m3H(sc, x, y) > 0) return false;
  const p = m3Prop(sc, x, y);
  return !(p && M3_PROPS[p] && M3_PROPS[p][2]);
}
function m3NewScene(campId, n) {
  const [w, h] = M3_SIZES[1];
  return { campaignId: campId, name: n || 'Nova cena', w, h, ground: 'p'.repeat(w * h),
    height: '0'.repeat(w * h), props: {}, objects: [], turn: null, createdAt: Date.now(), updatedAt: Date.now() };
}
function m3Scenes(campId) { return S.data.scenes.filter(s => s.campaignId === campId).sort(byCreated); }
function m3Cur() {

/* quantos quadrados o personagem anda: lê o atributo de deslocamento, senão 6 */
function m3Move(o) {
  const a = (o.attrs || []).find(x => /desl|movi|veloc/i.test(String(x.name || '').normalize('NFD').replace(/[̀-ͯ]/g, '')));
  if (!a) return 6;
  const raw = String(a.value || '');
  const n = parseFloat(raw.replace(',', '.'));
  if (!Number.isFinite(n) || n <= 0) return 6;
  return /m/i.test(raw) && n >= 3 ? Math.max(1, Math.round(n / 1.5)) : Math.max(1, Math.round(n));
}
/* tokens da cena: personagens da campanha + criaturas em campo */
function m3Tokens(sc) {
  if (!sc) return [];
  const chars = S.data.characters.filter(c => c.campaignId === sc.campaignId).sort(byCreated);
  const mons = S.data.monsters.filter(m => m.campaignId === sc.campaignId && m.inField).sort(byCreated);
  const taken = new Set(), out = [];
  const put = (col, o, x, y) => { taken.add(x + ',' + y); out.push({ key: col[0] + ':' + o.id, col, o, x, y }); };
  const free = (sx, sy) => {
    for (let r = 0; r < Math.max(sc.w, sc.h); r++)
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const x = clamp(sx + dx, 0, sc.w - 1), y = clamp(sy + dy, 0, sc.h - 1);
        if (m3Walk(sc, x, y) && !taken.has(x + ',' + y)) return [x, y];
      }
    return [0, 0];
  };
  const place = (col, list, sy) => list.forEach((o, i) => {
    const c = o.cell;
    if (c && m3In(sc, num(c.x), num(c.y)) && !taken.has(num(c.x) + ',' + num(c.y))) return put(col, o, num(c.x), num(c.y));
    const [x, y] = free(Math.floor(sc.w / 2) + (i % 2 ? 1 : -1) * Math.ceil(i / 2), sy);
    put(col, o, x, y);
  });

  place('characters', chars, sc.h - 2);

}
const m3CanMove = t => t.col === 'monsters' ? isMaster() : canEditChar(t.o);
function m3MyTurn(sc, t) {
  if (isMaster()) return true;
  const tn = sc.turn;
  if (!tn || !tn.order || !tn.order.length) return true;
  if (!tn.order.includes(t.key)) return true;   // fora do combate, anda livre
  return tn.order[tn.idx % tn.order.length] === t.key;

/* alcance de movimento: busca em largura pelas casas livres */
function m3Reach(sc, from, steps, tokens) {
  const block = new Set(tokens.filter(t => !(t.x === from.x && t.y === from.y)).map(t => t.x + ',' + t.y));
  const seen = new Map([[from.x + ',' + from.y, 0]]);
  let edge = [[from.x, from.y]];
  for (let d = 1; d <= steps; d++) {
    const next = [];
    for (const [x, y] of edge)
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (seen.has(k) || !m3Walk(sc, nx, ny) || block.has(k)) continue;
        if (dx && dy && !(m3Walk(sc, x + dx, y) && m3Walk(sc, x, y + dy))) continue;
        seen.set(k, d); next.push([nx, ny]);
      }
    edge = next;
    if (!edge.length) break;
  }
  seen.delete(from.x + ',' + from.y);
  return seen;
}

/* ---------- carregar o motor 3D ---------- */
function m3Load() {
  if (M3.lib || M3.loading || M3.failed) return;  // depois de falhar, só volta pelo "Tentar de novo"
  if (window.THREE) { M3.lib = window.THREE; scheduleRender(); return; }
  M3.loading = true; M3.failed = false;
  let i = 0, done = false;
  const give = ok => {
    if (done) return; done = true;
    clearTimeout(M3.loadT);
    M3.loading = false; M3.lib = ok ? window.THREE : null; M3.failed = !M3.lib;
    scheduleRender();
  };
  // se a rede travar sem dar erro, não deixa a tela presa em "Montando a cena…"
  M3.loadT = setTimeout(() => give(!!window.THREE), 14000);
  const tryNext = () => {
    if (done) return;
    if (i >= M3_URLS.length) return give(false);
    const sc = document.createElement('script');
    sc.src = M3_URLS[i++];
    sc.onload = () => give(true);
    sc.onerror = () => { sc.remove(); tryNext(); };
    document.head.appendChild(sc);
  };
  tryNext();
}

const m3Tex = new Map();

    if (!src) { m3Tex.set(ref, null); return; }
    const T = M3.lib;
    new T.TextureLoader().load(src, tx => {
      tx.colorSpace = T.SRGBColorSpace || tx.colorSpace;
      m3Tex.set(ref, tx); M3.tokenSig = ''; scheduleRender();
    }, undefined, () => m3Tex.set(ref, null));

  if (ref.startsWith('a:')) make('/_blob/' + ref.slice(2));
  else {

    if (typeof c === 'string') make(c);
    else Promise.resolve(c || store.getImage(ref.slice(2)).then(d => { imgCache.set(ref, d || ''); return d; }))
      .then(d => make(d)).catch(() => m3Tex.set(ref, null));

  return null;
}

      const c = h.cell && m3In(sc, h.cell.x, h.cell.y) ? h.cell : null;
      const k = c ? c.x + ',' + c.y : '';

    }

function m3Owner(obj) {
  let o = obj;
  while (o && !o.userData.tok) o = o.parent;
  return o && o.userData.tok;
}
function m3Click(hit) {
  const sc = m3Cur(); if (!sc) return;
  if (isMaster() && S.m3Edit) {
    if (M3.tool === 'pista' || M3.tool === 'enigma' || M3.tool === 'npc') {
      if (hit.cell && m3In(sc, hit.cell.x, hit.cell.y))
        openModal({ type: 'sobj', sceneId: sc.id, isNew: true,
          draft: { id: uid(), kind: M3.tool, x: hit.cell.x, y: hit.cell.y, name: '', pub: '', secret: '', hidden: false, revealed: false } });
      return;
    }
    if (hit.obj) { m3OpenObj(sc, hit.obj); return; }
    return;
  }
  if (hit.obj) { m3OpenObj(sc, hit.obj); return; }
  if (hit.tok) {
    const t = (M3.toks || []).find(x => x.key === hit.tok);
    if (!t) return;
    if (M3.sel && M3.sel.kind === 'token' && M3.sel.key === hit.tok) { m3Select(null); return; }
    m3Select({ kind: 'token', key: hit.tok });
    return;
  }
  if (hit.cell && M3.sel && M3.sel.kind === 'token' && M3.reach.has(hit.cell.x + ',' + hit.cell.y)) {
    m3MoveTo(sc, M3.sel.key, hit.cell);

  }

}
function m3Select(sel) {
  M3.sel = sel; M3.reach = new Map();

    const t = (M3.toks || []).find(x => x.key === sel.key);
    if (t && m3CanMove(t) && m3MyTurn(sc, t) && !t.o.dead)
      M3.reach = m3Reach(sc, t, m3Move(t.o), M3.toks || []);

}
async function m3MoveTo(sc, key, cell) {
  const t = (M3.toks || []).find(x => x.key === key); if (!t) return;
  const g = M3.tokens.get(key);
  if (g) { g.userData.tx = cell.x; g.userData.tz = cell.y; }
  t.x = cell.x; t.y = cell.y;
  M3.reach = new Map(); m3Marks(sc); m3Tick();

  catch (e) { toast('Não foi possível mover.', 'err'); }
}
function m3OpenObj(sc, id) {

}

/* ---------- turnos ---------- */
async function m3StartTurns(sc, roll) {
  const toks = m3Tokens(sc).filter(t => !t.o.dead);
  const ord = toks.map(t => {
    let ini = 0;
    if (roll) {
      const a = (t.o.attrs || []).find(x => /ini|agi/i.test(String(x.name || '').normalize('NFD').replace(/[̀-ͯ]/g, '')));
      const bonus = a ? num(parseFloat(String(a.value).replace(',', '.'))) : 0;
      ini = 1 + Math.floor(Math.random() * 20) + bonus;
    }
    return { key: t.key, ini };
  });
  if (roll) ord.sort((a, b) => b.ini - a.ini);
  try {
    await store.update('scenes', sc.id, { turn: { order: ord.map(o => o.key), ini: ord.map(o => o.ini), idx: 0, round: 1, at: Date.now() }, updatedAt: Date.now() });
    toast(roll ? 'Iniciativa rolada.' : 'Combate iniciado.');
  } catch (e) { toast('Não foi possível iniciar os turnos.', 'err'); }
}
async function m3NextTurn(sc, back) {
  const tn = sc.turn; if (!tn) return;
  const n = tn.order.length || 1;
  let idx = tn.idx + (back ? -1 : 1), round = tn.round || 1;
  if (idx >= n) { idx = 0; round++; }
  if (idx < 0) { idx = n - 1; round = Math.max(1, round - 1); }
  try { await store.update('scenes', sc.id, { turn: { ...tn, idx, round, at: Date.now() }, updatedAt: Date.now() }); }
  catch (e) { toast('Não foi possível passar o turno.', 'err'); }
}

/* monta o canvas na tela depois de cada render */
function m3Mount(sc, toks) {
  if (M3.failed) { m3Stop(); return; }
  if (!M3.lib) { m3Load(); m3Stop(); return; }
  if (!M3.renderer) { try { m3Init(); } catch (e) { M3.failed = true; m3Stop(); scheduleRender(); return; } }
  const host = document.getElementById('m3-host');
  if (!host) { m3Stop(); return; }
  M3.host = host; M3.labels = document.getElementById('m3-labels');
  host.classList.toggle('edit', !!(isMaster() && S.m3Edit));
  host.classList.toggle('panning', !!M3.space);
  if (M3.renderer.domElement.parentElement !== host) host.insertBefore(M3.renderer.domElement, host.firstChild);
  m3Wire();
  const tSig = m3TSig(sc);
  if (tSig !== M3.terrainSig) {
    M3.terrainSig = tSig;
    m3Terrain(sc);
    if (sc.w !== M3.lastW || sc.h !== M3.lastH) { M3.lastW = sc.w; M3.lastH = sc.h; M3.tx = M3.tz = 0; M3.needFit = true; }
  }
  const oSig = JSON.stringify([isMaster(), (sc.objects || []).map(o => [o.id, o.x, o.y, o.kind, o.hidden, o.revealed])]);
  if (oSig !== M3.objSig) { M3.objSig = oSig; m3Objects(sc); }
  const kSig = S.user.id + '|' + toks.map(t => [t.key, t.o.portrait, t.o.dead, t.col === 'characters' && t.o.owner].join(',')).join('|');
  if (kSig !== M3.tokenSig) { M3.tokenSig = kSig; m3BuildTokens(sc, toks); }
  else toks.forEach(t => { const g = M3.tokens.get(t.key); if (g) { g.userData.tx = t.x; g.userData.tz = t.y; } });
  if (M3.sel && M3.sel.kind === 'token' && !toks.some(t => t.key === M3.sel.key)) { M3.sel = null; M3.reach = new Map(); }
  m3Marks(sc);
  m3Tick();
}

async function saveScene(m) {
  const d = m.draft;
  const name = d.name.trim() || 'Cena';
  if (m.isNew) {
    const id = uid(), sc = m3NewScene(d.campaignId, name);
    sc.w = d.w; sc.h = d.h; sc.ground = 'p'.repeat(d.w * d.h); sc.height = '0'.repeat(d.w * d.h);
    try { await store.set('scenes', id, sc); S.m3Id = id; M3.terrainSig = ''; closeModal(true); toast('Cena criada.'); }
    catch (e) { toast('Não foi possível criar a cena.', 'err'); }
    return;
  }
  const prev = get('scenes', m.id); if (!prev) { closeModal(); return; }
  const patch = { name, updatedAt: Date.now() };
  if (d.w !== prev.w || d.h !== prev.h) {
    let g = '', h = '';
    for (let y = 0; y < d.h; y++) for (let x = 0; x < d.w; x++) {
      const inside = x < prev.w && y < prev.h;
      g += inside ? m3G(prev, x, y) : 'p';
      h += inside ? String(m3H(prev, x, y)) : '0';
    }
    const props = {};
    Object.entries(prev.props || {}).forEach(([k, v]) => { const [x, y] = k.split(',').map(Number); if (x < d.w && y < d.h) props[k] = v; });
    Object.assign(patch, { w: d.w, h: d.h, ground: g, height: h, props,
      objects: (prev.objects || []).filter(o => o.x < d.w && o.y < d.h) });
  }
  try { await store.update('scenes', m.id, patch); M3.terrainSig = ''; closeModal(true); toast('Cena salva.'); }
  catch (e) { toast('Não foi possível salvar a cena.', 'err'); }
}

async function saveSobj(m) {
  const sc = get('scenes', m.sceneId); if (!sc) { closeModal(); return; }
  const d = clone(m.draft);
  d.name = d.name.trim() || (M3_KINDS[d.kind] || M3_KINDS.pista)[0];
  d.pub = d.pub.trim(); d.secret = d.secret.trim();
  const objs = clone(sc.objects || []);
  const i = objs.findIndex(o => o.id === d.id);
  if (i >= 0) objs[i] = { ...objs[i], ...d }; else objs.push(d);
  try { await store.update('scenes', sc.id, { objects: objs, updatedAt: Date.now() }); M3.objSig = ''; closeModal(true); toast(m.isNew ? 'Ponto criado.' : 'Ponto salvo.'); }
  catch (e) { toast('Não foi possível salvar o ponto.', 'err'); }
}
async function m3ObjPatch(sc, id, patch) {
  const objs = clone(sc.objects || []);
  const i = objs.findIndex(o => o.id === id); if (i < 0) return;
  objs[i] = { ...objs[i], ...patch };
  M3.objSig = '';
  try { await store.update('scenes', sc.id, { objects: objs, updatedAt: Date.now() }); }
  catch (e) { toast('Não foi possível salvar.', 'err'); }
  return objs[i];
}

function openModal(m) {
  m.uploaded = m.uploaded || []; m.busy = 0;
  S.modal = m; renderModal(true);
}
function closeModal(saved) {
  const m = S.modal; if (!m) return;
  if (!saved && m.uploaded?.length) m.uploaded.forEach(deleteImageRef);
  S.modal = null; $('#overlay').innerHTML = '';
}
function renderModal(first) {
  const m = S.modal; if (!m) return;
  const sc = $('#overlay .modal-scroll'); const top = sc ? sc.scrollTop : 0;
  let html = '';
  if (m.type === 'sheet') html = sheetEditor(m);
  else if (m.type === 'library') html = libraryEditor(m);
  else if (m.type === 'campaign') html = campaignEditor(m);
  else if (m.type === 'map') html = mapEditor(m);
  else if (m.type === 'wp-edit') html = wpEditor(m);
  else if (m.type === 'wp-view') html = wpViewer(m);
  else if (m.type === 'conds') html = condsEditor(m);
  else if (m.type === 'msg') html = msgEditor(m);
  else if (m.type === 'scene') html = sceneEditor(m);
  else if (m.type === 'sobj') html = sobjEditor(m);
  $('#overlay').innerHTML = `<div class="scrim" data-scrim="overlay">${html}</div>`;
  hydrateImages($('#overlay'));
  const ns = $('#overlay .modal-scroll'); if (ns) ns.scrollTop = top;
  if (first) setTimeout(() => { const f = $('#overlay [data-autofocus]') || $('#overlay .modal-scroll input, #overlay .modal-scroll textarea') || $('#overlay [data-action="close"]'); f?.focus(); });
}

const busyNote = m => m.busy ? '<div class="uploading">Enviando imagem…</div>' : '';
const saveBtns = (m, label) => `<button class="btn ghost" data-action="close">Cancelar</button><button class="btn primary" data-action="save-modal" ${m.busy ? 'disabled' : ''}>${esc(label)}</button>`;
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; o = o[k]; if (o == null) return; }
  o[ks[ks.length - 1]] = val;
}
async function uploadInto(files, kind, onRef) {
  const m = S.modal; if (!m || !files.length) return;
  m.busy++; renderModal();
  for (const f of files) {
    try { const ref = await saveImage(f, kind); if (S.modal !== m) { deleteImageRef(ref); break; } m.uploaded.push(ref); onRef(ref); }
    catch (e) { toast(e.message || 'Falha ao enviar a imagem.', 'err'); }
  }
  m.busy--; if (S.modal === m) renderModal();
}
function cleanupRefs(m, newRefs) {
  const keep = new Set(newRefs);
  [...(m.orig || []), ...(m.uploaded || [])].forEach(r => { if (!keep.has(r)) deleteImageRef(r); });
}

document.addEventListener('submit', e => { if (e.target.id === 'login-form') { e.preventDefault(); doLogin(); } });

document.addEventListener('change', async e => {
  if (e.target.id === 'm3-camp') { S.gameCamp = e.target.value; ls('grimorio-gamecamp', S.gameCamp); S.m3Id = null; M3.sel = null; M3.terrainSig = ''; render(); }
  if (e.target.id === 'm3-scene') { S.m3Id = e.target.value; M3.sel = null; M3.terrainSig = ''; render(); }
  if (e.target.id === 'game-camp') { S.gameCamp = e.target.value; ls('grimorio-gamecamp', S.gameCamp); S.token = null; render(); }
  if (e.target.id === 'arena-scene') {
    const camp = get('campaigns', isMaster() ? S.gameCamp : S.playerGameCamp);
    if (camp) { try { await store.update('campaigns', camp.id, { scene: e.target.value }); } catch (err) { toast('Não foi possível trocar o cenário.', 'err'); } }
  }
});
document.addEventListener('keydown', e => {
  const typing = /^(input|textarea|select)$/i.test(document.activeElement && document.activeElement.tagName || '');
  if (route().view === 'mesa' && !typing && !S.modal) {
    if (e.code === 'Space' && !e.repeat) { M3.space = true; const h = M3.host; if (h) h.classList.add('panning'); e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && isMaster() && S.m3Edit) { e.preventDefault(); m3UndoPop(); render(); return; }
  }
  if (e.key !== 'Escape') return;
  if (document.getElementById('splash').querySelector('.post')) { closePost(); render(); return; }
  if (M3.sel && route().view === 'mesa') { m3Select(null); return; }
  if (S.token) { S.token = null; render(); return; }
  if (document.getElementById('fx').innerHTML) return closeFx();
  if ($('#lightbox').innerHTML) return closeLightbox();
  if ($('#confirm').innerHTML) return endConfirm(false);
  if (S.modal && !S.modal.busy) closeModal();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  M3.space = false; const h = M3.host; if (h) h.classList.remove('panning');
});
window.addEventListener('blur', () => { M3.space = false; const h = M3.host; if (h) h.classList.remove('panning'); });
document.addEventListener('pointerdown', e => { S.scrimDown = e.target.dataset?.scrim || null; });
document.addEventListener('click', async e => {
  const scrim = e.target.dataset?.scrim;
  if (scrim && S.scrimDown === scrim) {
    if (scrim === 'confirm') endConfirm(false);
    else if (scrim === 'overlay' && S.modal && !S.modal.busy) closeModal();
    return;
  }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const m = S.modal; const ds = el.dataset;
  switch (a) {
    case 'pick-user': $('#lu').value = ds.u; $('#lerr').classList.add('hidden'); $('#lp').value = ''; $('#lp').focus(); break;
    case 'logout': closeModal(); applySkin(null); M3.sel = null; M3.reach = new Map(); M3.objSig = ''; M3.tokenSig = ''; S.user = null; ls('grimorio-user', null); S.mapEdit = false; location.hash = ''; $('#app').innerHTML = ''; render(); break;
    case 'set-skin': {
      applySkin(ds.id); ls('grimorio-skin-' + S.user.id, S.skin); render();
      toast('Tema ' + (SKINS.find(k => k.id === S.skin)?.name || '') + ' aplicado.');
      break;
    }
    case 'theme': {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark'; ls('grimorio-theme', root.dataset.theme); break;
    }
    case 'close': if (!m?.busy) closeModal(); break;
    case 'close-lb': closeLightbox(); break;
    case 'zoom': openLightbox(ds.ref); break;
    case 'confirm-yes': endConfirm(true); break;
    case 'confirm-no': endConfirm(false); break;
    case 'adj': adjust(ds.col, ds.id, ds.stat, num(ds.d)); break;
    case 'dice-qty': S.dice.qty = clamp(S.dice.qty + num(ds.d), 1, 12); render(); break;
    case 'dice-mod': S.dice.mod = clamp(S.dice.mod + num(ds.d), -20, 20); render(); break;
    case 'roll': rollDice(num(ds.sides)); break;
    case 'roll-attr': rollDice(num(ds.sides), { qty: 1, mod: num(ds.mod), label: ds.label }); break;
    case 'add-lib-attr': if (m) { m.draft.attrs.push({ id: uid(), name: '', die: '' }); renderModal();
      const inp = $('#overlay').querySelectorAll('[data-bind^="attrs."]'); inp[inp.length - 1]?.focus(); } break;
    case 'lib-die': if (m) { m.draft.attrs[num(ds.i)].die = dieOf(ds.die); renderModal(); } break;
    case 'sheet-die': if (m) { m.draft.attrs[num(ds.i)].die = dieOf(ds.die); renderModal(); } break;
    case 'pick-token': {
      const o = get(ds.col, ds.id); if (!o) break;
      if (ds.col === 'monsters' ? !isMaster() : !canEditChar(o)) break;
      S.token = (S.token && S.token.id === ds.id) ? null : { col: ds.col, id: ds.id };
      render(); break;
    }
    case 'move-token': {
      const t = S.token; if (!t) break;
      S.token = null;
      try { await store.update(t.col, t.id, { pos: num(ds.n) }); } catch (err) { toast('Não foi possível mover o token.', 'err'); }
      render(); break;
    }
    case 'arena-size': {
      const camp = get('campaigns', ds.camp); if (!camp || !isMaster()) break;
      const g = gridOf(camp); const d = num(ds.d);
      let cols = g.cols, rows = g.rows;
      if (d > 0) { if (cols <= rows * 1.6 && cols < COLS_MAX) cols++; else if (rows < ROWS_MAX) rows++; else if (cols < COLS_MAX) cols++; }
      else { if (rows > cols / 1.6 && rows > ROWS_MIN) rows--; else if (cols > COLS_MIN) cols--; else if (rows > ROWS_MIN) rows--; }
      if (cols === g.cols && rows === g.rows) break;
      S.token = null;
      try { await store.update('campaigns', camp.id, { cols, rows }); toast(cols * rows + ' pontos no campo.'); }
      catch (err) { toast('Não foi possível mudar o tamanho do campo.', 'err'); }
      break;
    }
    case 'reset-arena': {
      const ids = [...S.data.characters.filter(c => c.campaignId === ds.camp), ...S.data.monsters.filter(m => m.campaignId === ds.camp)];
      S.token = null;
      try { for (const o of ids) if (Number.isInteger(o.pos)) await store.update(S.data.characters.includes(o) ? 'characters' : 'monsters', o.id, { pos: null }); toast('Tokens reorganizados.'); }
      catch (err) { toast('Não foi possível reorganizar.', 'err'); }
      break;
    }
    case 'm3-retry': M3.failed = false; M3.lib = null; m3Load(); render(); break;
    case 'm3-tool': M3.tool = ds.t; M3.rectFrom = null; m3Ghost(m3Cur()); render(); break;
    case 'm3-brush': M3.brush = clamp(num(ds.b), 0, 2); M3.rectFrom = null; m3Ghost(m3Cur()); render(); break;
    case 'm3-rect': M3.rect = !M3.rect; M3.rectFrom = null; m3Ghost(m3Cur()); render(); break;
    case 'm3-undo': m3UndoPop(); render(); break;
    case 'm3-fill': {
      const sc = m3Cur(); if (!sc || !isMaster()) break;
      if (M3_PROPS[M3.tool] || M3_KINDS[M3.tool]) { toast('Preencher tudo vale para piso, paredes e apagar.'); break; }
      m3UndoPush(sc);
      m3PaintCells(sc, m3AreaCells(sc, { x: 0, y: 0 }, { x: sc.w - 1, y: sc.h - 1 }));
      m3Patch({}, true); render(); break;
    }
    case 'm3-grid': M3.grid = !M3.grid; m3Tick(); render(); break;
    case 'm3-edit': S.m3Edit = !S.m3Edit; M3.sel = null; M3.reach = new Map(); render(); break;
    case 'm3-zoom':
      if (ds.z === 'fit') { M3.tx = M3.tz = 0; M3.yaw = Math.PI / 4; M3.pitch = 0.68; M3.needFit = true; }
      else M3.zoom = clamp(M3.zoom * (ds.z === 'in' ? 1.25 : 1 / 1.25), 0.45, 4);
      m3Tick(); break;
    case 'm3-rot': M3.yaw += num(ds.d) * Math.PI / 8; m3Tick(); break;
    case 'm3-focus': {
      const t = (M3.toks || []).find(x => x.key === ds.k); if (!t) break;
      const sc = m3Cur(); if (sc) { M3.tx = t.x + 0.5 - sc.w / 2; M3.tz = t.y + 0.5 - sc.h / 2; }
      m3Select({ kind: 'token', key: ds.k }); break;
    }
    case 'm3-new': openModal({ type: 'scene', isNew: true, draft: { campaignId: ds.camp, name: '', w: M3_SIZES[1][0], h: M3_SIZES[1][1] } }); break;
    case 'm3-rename': { const sc = get('scenes', ds.id); if (!sc) break;
      openModal({ type: 'scene', id: sc.id, draft: { campaignId: sc.campaignId, name: sc.name || '', w: sc.w, h: sc.h } }); break; }
    case 'm3-size': if (m) { m.draft.w = num(ds.w); m.draft.h = num(ds.h); renderModal(); } break;
    case 'm3-okind': if (m) { m.draft.kind = ds.k; renderModal(); } break;
    case 'm3-del': { const sc = get('scenes', ds.id); if (!sc || !isMaster()) break;
      if (!await confirmDialog('Excluir cena?', `“${sc.name}” e tudo que você montou nela serão apagados para a mesa.`, 'Excluir cena')) break;
      try { await store.remove('scenes', sc.id); S.m3Id = null; M3.terrainSig = ''; toast('Cena excluída.'); } catch (err) { toast('Não foi possível excluir.', 'err'); }
      break; }
    case 'm3-turn-start': { const sc = m3Cur(); if (sc && isMaster()) await m3StartTurns(sc, !!ds.roll); break; }
    case 'm3-turn-sync': { const sc = m3Cur(); if (!sc || !isMaster() || !sc.turn) break;
      const tn = sc.turn, novos = (M3.toks || []).filter(t => !t.o.dead && !tn.order.includes(t.key));
      if (!novos.length) break;
      const order = [...tn.order, ...novos.map(t => t.key)];
      const ini = tn.ini ? [...tn.ini, ...novos.map(() => 0)] : null;
      try { await store.update('scenes', sc.id, { turn: { ...tn, order, ini }, updatedAt: Date.now() }); toast('Ordem atualizada.'); }
      catch (err) { toast('Não foi possível atualizar a ordem.', 'err'); }
      break; }
    case 'm3-turn-step': { const sc = m3Cur(); if (sc && isMaster()) await m3NextTurn(sc, num(ds.d) < 0); break; }
    case 'm3-turn-end': { const sc = m3Cur(); if (!sc || !isMaster()) break;
      try { await store.update('scenes', sc.id, { turn: null, updatedAt: Date.now() }); toast('Combate encerrado.'); } catch (err) {}
      break; }
    case 'm3-obj-sel': { const sc = m3Cur(); if (sc) m3OpenObj(sc, ds.id); break; }
    case 'm3-obj-edit': { const sc = m3Cur(); const o = sc && (sc.objects || []).find(x => x.id === ds.id); if (!o) break;
      openModal({ type: 'sobj', sceneId: sc.id, draft: { ...o, pub: o.pub || '', secret: o.secret || '', name: o.name || '' } }); break; }
    case 'm3-obj-hide': { const sc = m3Cur(); const o = sc && (sc.objects || []).find(x => x.id === ds.id); if (!o || !isMaster()) break;
      await m3ObjPatch(sc, ds.id, { hidden: !o.hidden }); toast(!o.hidden ? 'Oculto dos jogadores.' : 'Visível no cenário.'); break; }
    case 'm3-obj-del': { const sc = m3Cur(); if (!sc || !isMaster()) break;
      if (!await confirmDialog('Excluir ponto?', 'Ele some do cenário para todos.', 'Excluir')) break;
      const objs = clone(sc.objects || []).filter(x => x.id !== ds.id);
      M3.objSig = ''; if (M3.sel && M3.sel.id === ds.id) M3.sel = null;
      if (S.modal && S.modal.type === 'sobj') closeModal();
      try { await store.update('scenes', sc.id, { objects: objs, updatedAt: Date.now() }); toast('Ponto excluído.'); } catch (err) {}
      break; }
    case 'm3-obj-reveal': { const sc = m3Cur(); const o = sc && (sc.objects || []).find(x => x.id === ds.id); if (!o || !isMaster()) break;
      await m3ObjPatch(sc, ds.id, { revealed: true, hidden: false });
      const kind = o.kind === 'npc' ? 'mensagem' : 'pista';
      try {
        await store.set('messages', uid(), { campaignId: sc.campaignId, from: S.user.id, fromName: S.user.name, to: 'all',
          kind, text: (o.name || '') + (o.pub ? '\n' + o.pub : ''), image: null, at: Date.now() });
        toast('Revelado à mesa.');
      } catch (err) { toast('Não foi possível revelar.', 'err'); }
      break; }
    case 'new-msg': openModal({ type: 'msg', draft: { campaignId: ds.camp, to: isMaster() ? 'all' : 'mestre', kind: 'mensagem', text: '', image: null }, orig: [] }); break;
    case 'msg-kind': if (m) { m.draft.kind = ds.k; renderModal(); } break;
    case 'pick-msgimg': { const f = await pickFiles(false); uploadInto(f, 'photo', r => { S.modal.draft.image = r; }); break; }
    case 'rm-msgimg': if (m) { m.draft.image = null; renderModal(); } break;
    case 'open-msg': { const msg = get('messages', ds.id); if (msg) showPost(msg); render(); break; }
    case 'close-post': if (e.target.closest('[data-stop]') && !e.target.closest('[data-action="close-post"]')) break; closePost(); render(); break;
    case 'open-conds': {
      const o = get(ds.col, ds.id); if (!o) break;
      if (ds.col === 'monsters' ? !isMaster() : !canEditChar(o)) break;
      openModal({ type: 'conds', col: ds.col, id: ds.id, draft: {} });
      break;
    }
    case 'cond-toggle': case 'cond-off': case 'cond-clear': {
      const o = get(ds.col, ds.id); if (!o) break;
      if (ds.col === 'monsters' ? !isMaster() : !canEditChar(o)) break;
      let conds = [...(o.conds || [])];
      if (a === 'cond-clear') conds = [];
      else if (a === 'cond-off') conds = conds.filter(x => x !== ds.c);
      else conds = conds.includes(ds.c) ? conds.filter(x => x !== ds.c) : [...conds, ds.c];
      try { await store.update(ds.col, ds.id, { conds }); if (S.modal && S.modal.type === 'conds') renderModal(); }
      catch (err) { toast('Não foi possível salvar a condição.', 'err'); }
      break;
    }
    case 'mark-dead': {
      const col = ds.col, o = get(col, ds.id); if (!o) break;
      if (col === 'characters' && !canEditChar(o)) break;
      if (col === 'monsters' && !isMaster()) break;
      try {
        await store.update(col, ds.id, col === 'monsters' ? { dead: true, inField: false } : { dead: true });
        toast(col === 'monsters' ? 'Criatura derrotada e fora de campo.' : 'Personagem marcado como morto.');
      } catch (err) { toast('Não foi possível salvar.', 'err'); }
      break;
    }
    case 'revive': {
      const col = ds.col, o = get(col, ds.id); if (!o) break;
      if (col === 'characters' && !canEditChar(o)) break;
      if (col === 'monsters' && !isMaster()) break;
      try { await store.update(col, ds.id, { dead: false }); toast(col === 'monsters' ? 'Criatura de volta ao bestiário.' : 'Personagem de volta ao jogo.'); }
      catch (err) { toast('Não foi possível salvar.', 'err'); }
      break;
    }
    case 'close-fx': closeFx(); break;
    case 'toggle-field': {
      const mo = get('monsters', ds.id); if (!mo) break;
      try { await store.update('monsters', mo.id, { inField: !mo.inField }); toast(!mo.inField ? 'Em campo: os jogadores já estão vendo.' : 'Criatura saiu de campo.'); }
      catch (err) { toast('Não foi possível atualizar o campo.', 'err'); }
      break;
    }
    case 'clear-field': {
      const act = S.data.monsters.filter(x => x.campaignId === ds.camp && x.inField);
      try { for (const x of act) await store.update('monsters', x.id, { inField: false }); toast('Campo limpo.'); }
      catch (err) { toast('Não foi possível limpar o campo.', 'err'); }
      break;
    }
    case 'pick-gamechar': S.gameChar = ds.id; ls('grimorio-gamechar-' + S.user.id, ds.id); render(); window.scrollTo(0, 0); break;
    case 'play-char': S.gameChar = ds.id; ls('grimorio-gamechar-' + S.user.id, ds.id); go('#/jogo'); break;
    case 'fullscreen':
      try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
      catch (err) { toast('O navegador não liberou a tela cheia aqui. Tente a tecla F11.', 'err'); }
      break;
    case 'toggle-vis': {
      const mo = get('monsters', ds.id); if (!mo) break;
      try { await store.update('monsters', mo.id, { visible: !mo.visible }); toast(!mo.visible ? 'Agora os jogadores veem esta criatura.' : 'Criatura oculta dos jogadores.'); }
      catch (err) { toast('Não foi possível mudar a visibilidade.', 'err'); }
      break;
    }

    /* biblioteca */
    case 'new-library': openModal({ type: 'library', isNew: true, draft: { name: '', description: '', color: LIB_COLORS[S.data.libraries.length % LIB_COLORS.length][0], hpLabel: '', manaLabel: '', attrs: [{ id: uid(), name: '', die: '' }] } }); break;
    case 'edit-library': { const l = get('libraries', ds.id); if (!l) break;
      openModal({ type: 'library', id: l.id, draft: { name: l.name || '', description: l.description || '', color: l.color || LIB_COLORS[0][0], hpLabel: l.hpLabel || '', manaLabel: l.manaLabel || '', attrs: libAttrs(l).map(a => ({ id: uid(), ...a })) } }); break; }
    case 'del-library': { const l = get('libraries', ds.id); if (!l) break;
      const camps = S.data.campaigns.filter(c => c.libraryId === l.id);
      if (!await confirmDialog('Excluir livro?', `“${l.name}” e ${camps.length ? `suas ${camps.length} campanha(s), com todas as fichas, monstros e mapas,` : 'tudo que estiver nele'} serão apagados para todos. Não dá para desfazer.`, 'Excluir livro')) break;
      try { for (const c of camps) await removeCampaign(c); await store.remove('libraries', l.id); toast('Livro excluído.'); go('#/'); } catch (err) { toast('Não foi possível excluir tudo. Tente de novo.', 'err'); }
      break; }
    case 'set-color': if (m) { m.draft.color = ds.c; renderModal(); } break;

    /* campanha */
    case 'new-campaign': openModal({ type: 'campaign', isNew: true, draft: { libraryId: ds.lib, name: '', synopsis: '', cover: null }, orig: [] }); break;
    case 'edit-campaign': { const c = get('campaigns', ds.id); if (!c) break;
      openModal({ type: 'campaign', id: c.id, draft: { libraryId: c.libraryId, name: c.name || '', synopsis: c.synopsis || '', cover: c.cover || null }, orig: [c.cover].filter(Boolean) }); break; }
    case 'del-campaign': { const c = get('campaigns', ds.id); if (!c) break;
      if (!await confirmDialog('Excluir campanha?', `“${c.name}” será apagada com todas as fichas, monstros e mapas dela, para todos da mesa. Não dá para desfazer.`, 'Excluir campanha')) break;
      try { await removeCampaign(c); toast('Campanha excluída.'); go('#/b/' + encodeURIComponent(c.libraryId)); } catch (err) { toast('Não foi possível excluir. Tente de novo.', 'err'); }
      break; }
    case 'pick-cover': { const f = await pickFiles(false); uploadInto(f, 'cover', r => { S.modal.draft.cover = r; }); break; }
    case 'rm-cover': if (m) { m.draft.cover = null; renderModal(); } break;

    /* fichas */
    case 'new-char': openModal({ type: 'sheet', col: 'characters', isNew: true, draft: newSheet(ds.camp, 'char'), orig: [] }); break;
    case 'new-monster': openModal({ type: 'sheet', col: 'monsters', isNew: true, draft: newSheet(ds.camp, 'monster'), orig: [] }); break;
    case 'edit-char': case 'edit-monster': {
      const col = a === 'edit-char' ? 'characters' : 'monsters'; const o = get(col, ds.id); if (!o) break;
      if (col === 'characters' && !canEditChar(o)) break;
      const d = clone(o); delete d.id;
      d.attrs = (d.attrs || []).map(a => ({ ...a, die: attrDie(o, a) })); d.items = d.items || []; d.sections = (d.sections || []).map(s => ({ ...s, fields: s.fields || [] })); d.gallery = d.gallery || [];
      d.hp = d.hp || { cur: 0, max: 0 }; d.mana = d.mana || { cur: 0, max: 0 }; d.notes = d.notes || ''; d.subtitle = d.subtitle || '';
      openModal({ type: 'sheet', col, id: o.id, draft: d, orig: sheetRefs(o) }); break;
    }
    case 'del-char': case 'del-monster': {
      const col = a === 'del-char' ? 'characters' : 'monsters'; const o = get(col, ds.id); if (!o) break;
      if (col === 'characters' && !canEditChar(o)) break;
      if (!await confirmDialog(col === 'characters' ? 'Excluir personagem?' : 'Excluir monstro?', `“${o.name}” será apagado para todos. Não dá para desfazer.`, 'Excluir')) break;
      try { await removeChar(col, o); toast('Excluído.'); go('#/c/' + encodeURIComponent(o.campaignId) + (col === 'characters' ? '/fichas' : '/monstros')); } catch (err) { toast('Não foi possível excluir.', 'err'); }
      break; }
    case 'pick-portrait': { const f = await pickFiles(false); uploadInto(f, 'portrait', r => { S.modal.draft.portrait = r; }); break; }
    case 'rm-portrait': if (m) { m.draft.portrait = null; renderModal(); } break;
    case 'add-gallery': { const f = await pickFiles(true); uploadInto(f, 'photo', r => { S.modal.draft.gallery.push(r); }); break; }
    case 'add-row': if (m) {
      const L = ds.list;
      if (L === 'attrs') m.draft.attrs.push({ id: uid(), name: '', value: '', die: '' });
      if (L === 'items') m.draft.items.push({ id: uid(), name: '', qty: '1', damage: '', notes: '' });
      if (L === 'sections') m.draft.sections.push({ id: uid(), title: '', fields: [{ id: uid(), label: '', value: '' }] });
      renderModal();
      const inputs = $('#overlay').querySelectorAll(`[data-bind^="${L}."]`);
      if (L !== 'sections') inputs[inputs.length - (L === 'items' ? 4 : 2)]?.focus();
      else [...inputs].filter(i => i.dataset.bind.endsWith('.title')).pop()?.focus();
    } break;
    case 'rm-row': if (m) { m.draft[ds.list].splice(num(ds.i), 1); renderModal(); } break;
    case 'add-field': if (m) { const s = m.draft.sections[num(ds.si)]; s.fields.push({ id: uid(), label: '', value: '' }); renderModal();
      $(`#overlay [data-bind="sections.${ds.si}.fields.${s.fields.length - 1}.label"]`)?.focus(); } break;
    case 'rm-field': if (m) { m.draft.sections[num(ds.si)].fields.splice(num(ds.i), 1); renderModal(); } break;

    /* mapa */
    case 'new-map': openModal({ type: 'map', isNew: true, draft: { campaignId: ds.camp, name: '', image: null }, orig: [] }); break;
    case 'edit-map': { const mp = get('maps', ds.id); if (!mp) break; openModal({ type: 'map', id: mp.id, draft: { campaignId: mp.campaignId, name: mp.name || '', image: mp.image }, orig: [mp.image] }); break; }
    case 'pick-mapimg': { const f = await pickFiles(false); uploadInto(f, 'map', r => { S.modal.draft.image = r; }); break; }
    case 'del-map': { const mp = get('maps', ds.id); if (!mp) break;
      if (!await confirmDialog('Excluir mapa?', `“${mp.name}” e todos os pontos dele serão apagados para todos.`, 'Excluir mapa')) break;
      closeModal(); try { await removeMap(mp); S.mapId = null; toast('Mapa excluído.'); } catch (err) { toast('Não foi possível excluir o mapa.', 'err'); } break; }
    case 'pick-map': S.mapId = ds.id; S.mapView = { s: 1, x: 0, y: 0 }; S.mapFitted = false; S.mapEdit = false; render(); break;
    case 'map-edit': S.mapEdit = !S.mapEdit; if (S.mapEdit) S.fogMode = false; render(); break;
    case 'fog-mode': S.fogMode = !S.fogMode; if (S.fogMode) { S.mapEdit = false; S.fogBrush = S.fogBrush || 'hide'; } render(); break;
    case 'fog-brush': S.fogBrush = ds.b; render(); break;
    case 'fog-all': {
      const map = get('maps', ds.id); if (!map || !isMaster()) break;
      S.fogDraft = null;
      try { await store.update('maps', map.id, { fog: (ds.v === '1' ? '1' : '0').repeat(FOG_N) }); toast(ds.v === '1' ? 'Mapa coberto pela névoa.' : 'Mapa todo revelado.'); }
      catch (err) { toast('Não foi possível salvar a névoa.', 'err'); }
      break;
    }
    case 'map-labels': S.mapLabels = !S.mapLabels; render(); break;
    case 'zoom-map': S.mapZoom && S.mapZoom(ds.z); break;
    case 'open-wp': openWaypoint(ds.id); break;
    case 'edit-wp': { const mp = get('maps', m?.mapId); const w = mp && (mp.waypoints || []).find(x => x.id === m.wpId); if (!w) break;
      const d = clone(w); d.images = d.images || []; d.description = d.description || ''; d.title = d.title || '';
      openModal({ type: 'wp-edit', mapId: mp.id, draft: d, orig: [...d.images] }); break; }
    case 'add-wpimg': { const f = await pickFiles(true); uploadInto(f, 'photo', r => { S.modal.draft.images.push(r); }); break; }
    case 'del-wp': { const mp = get('maps', m?.mapId); if (!mp) break;
      if (!await confirmDialog('Excluir ponto?', 'O ponto e as imagens dele serão apagados para todos.', 'Excluir ponto')) break;
      const wps = clone(mp.waypoints || []).filter(w => w.id !== m.draft.id);
      try { await saveMapWaypoints(mp.id, wps); [...(m.orig || []), ...(m.uploaded || [])].forEach(deleteImageRef); S.modal = null; $('#overlay').innerHTML = ''; toast('Ponto excluído.'); } catch (err) {}
      break; }

    case 'save-modal':
      if (!m || m.busy) break;
      el.disabled = true;
      if (m.type === 'msg') await sendMsg(m);
      else if (m.type === 'scene') await saveScene(m);
      else if (m.type === 'sobj') await saveSobj(m);
      else if (m.type === 'sheet') await saveSheet(m);
      else if (m.type === 'library') await saveLibrary(m);
      else if (m.type === 'campaign') await saveCampaign(m);
      else if (m.type === 'map') await saveMap(m);
      else if (m.type === 'wp-edit') await saveWp(m);
      if (S.modal === m) el.disabled = false;
      break;
  }
});

/* =========================================================
   Início
   ========================================================= */
(function init() {
  const t = ls('grimorio-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  const saved = ls('grimorio-user'); S.user = USERS.find(u => u.id === saved) || null;
  if (S.user) { S.gameChar = ls('grimorio-gamechar-' + S.user.id); applySkin(ls('grimorio-skin-' + S.user.id)); }
  S.gameCamp = ls('grimorio-gamecamp');
  render();
  boot();
})();
async function boot() {
  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
  if (db) {
    store = makeDbStore(db); S.mode = 'online';
    window.claude.use('assets').then(a => { S.assets = a || null; }).catch(() => {});
  } else {
    store = makeLocalStore(); S.mode = 'local';
  }
  const pending = new Set(COLS);
  // trava de segurança: se alguma coleção não responder, a tela abre assim mesmo
  const readyT = setTimeout(() => { if (!S.ready) { S.ready = true; scheduleRender(); } }, 2500);
  const markReady = () => { if (!pending.size) { S.ready = true; clearTimeout(readyT); } };
  COLS.forEach(c => {
    try {
      store.watch(c, list => {
        S.data[c] = list; pending.delete(c);
        if (c === 'characters' || c === 'monsters') checkDeaths(c, list);
        if (c === 'messages') checkMessages(list);
        if (c === 'monsters') checkField();
        markReady();
        scheduleRender();
        if (S.ready && S.modal && (S.modal.type === 'wp-view' || S.modal.type === 'conds')) renderModal();
      }, err => {
        pending.delete(c); markReady(); scheduleRender();
        if (err && err.code !== 'revoked') toast('A conexão com os dados da mesa caiu. Recarregue a página.', 'err');
      });
    } catch (e) { pending.delete(c); markReady(); scheduleRender(); }
  });
}
</script>
